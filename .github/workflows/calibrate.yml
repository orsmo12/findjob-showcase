name: "dev: calibrate scoring"   # כלי מפתח: כיול הניקוד על מודעות אמיתיות של המשתמש הראשון. קריאה בלבד
on: workflow_dispatch
jobs:
  calibrate:
    if: github.repository == 'orsmo12/findjob'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install groq httpx ddgs==9.14.4
      - run: python -u scripts/calibrate.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
