name: user_pause
on:
  workflow_dispatch:
    inputs:
      idx: { description: "מספר משתמש לפי סדר הרשמה (ריק = רק להציג)", default: "" }
      state: { description: "on = להשהות, off = להחזיר", default: "on" }
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: python -u scripts/user_pause.py "${{ inputs.idx }}" "${{ inputs.state }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
