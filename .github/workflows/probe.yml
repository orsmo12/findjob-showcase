name: "dev: probe company"   # כלי מפתח: למה חברה לא נמצאה. קריאה בלבד, בלי משתמשים ובלי AI
on:
  workflow_dispatch:
    inputs:
      name: { description: "שם החברה", required: true, default: "Hailo" }
jobs:
  probe:
    if: github.repository == 'orsmo12/findjob'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx ddgs==9.14.4
      - run: python -u scripts/probe_company.py "$NAME"
        env:
          NAME: ${{ github.event.inputs.name }}
