name: findjob probe
on:
  workflow_dispatch:
    inputs:
      names: { description: "companies", required: false, default: "" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx ddgs==9.14.4
      - run: python -u scripts/probe.py ${{ github.event.inputs.names }}
