name: "dev: search insights"   # כלי מפתח: תובנות על החיפוש של כל המשתמשים. קריאה בלבד, אנונימי
on:
  workflow_dispatch:
    inputs:
      days: { description: "כמה ימים אחורה", default: "14" }
jobs:
  insights:
    if: github.repository == 'orsmo12/findjob'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: python -u scripts/insights.py "${{ inputs.days }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
