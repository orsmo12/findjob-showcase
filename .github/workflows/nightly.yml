name: findjob nightly
on:
  schedule:
    - cron: "47 4,12 * * *"  # פעמיים ביום: 06:47 ו-14:47 שעון ישראל בחורף (07:47 ו-15:47 בקיץ). GitHub עובד ב-UTC
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית
    inputs:
      meeting: { description: "לכפות ישיבה שבועית (1)", required: false, default: "" }
      user: { description: "רק למשתמש אחד (user_id). ריק = כולם", required: false, default: "" }
permissions:
  contents: read
  actions: read
concurrency:
  group: findjob-agents-${{ github.event.inputs.user || 'all' }}   # ריצה אחת בכל פעם לכל משתמש (או לכולם). ריצה של משתמש אחד לא מחכה לסריקה של כולם
  cancel-in-progress: false
jobs:
  gate:   # GitHub schedule ו-Vercel cron עלולים לרוץ שניהם: ריצה מתוזמנת מדלגת אם סריקה כבר רצה ב-4 השעות האחרונות
    if: github.repository == 'orsmo12/findjob'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - id: dup
        if: github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          since=$(date -u -d '-4 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?per_page=10" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at > \"$since\" and .event != \"schedule\" and (.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\"))] | length")
          echo "recent=$n"; [ "$n" = "0" ] || echo "skip=1" >> "$GITHUB_OUTPUT"
  hunt:
    needs: gate
    if: github.repository == 'orsmo12/findjob' && needs.gate.outputs.skip != '1'   # בעותק ציבורי הסוכנים לא רצים
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-jobspy groq httpx python-dotenv ddgs==9.14.4 langgraph pywebpush
      - run: python -u scripts/nightly.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_USER: ${{ github.event.inputs.user }}
          FORCE_MEETING: ${{ github.event.inputs.meeting }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: agents work on the tasks the scan created (Gil, Kobi, Maya, Shai)
        if: always()
        run: python -u scripts/assistant_job.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_USER: ${{ github.event.inputs.user }}
