name: findjob nightly
on:
  schedule:
    - cron: "17 3 * * *"     # כל יום ב-05:17/06:17 שעון ישראל (GitHub עובד ב-UTC)
  workflow_dispatch: {}       # כפתור "Run workflow" להרצה ידנית
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-jobspy groq httpx python-dotenv
      - run: python -u scripts/nightly.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
