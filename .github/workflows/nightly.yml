name: findjob nightly
on:
  schedule:
    - cron: "17 3,15 * * *"  # כל 12 שעות: 05:17 ו-17:17 שעון ישראל (GitHub עובד ב-UTC)
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית
    inputs:
      meeting: { description: "לכפות ישיבה שבועית (1)", required: false, default: "" }
concurrency:
  group: findjob-agents      # סוכן אחד בכל פעם: חולקים את מכסת Groq
  cancel-in-progress: false
jobs:
  hunt:
    if: github.repository == 'orsmo12/findjob'   # בעותק ציבורי (אם יהיה) הסוכנים לא רצים
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-jobspy groq httpx python-dotenv ddgs==9.14.4
      - run: python -u scripts/nightly.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_MEETING: ${{ github.event.inputs.meeting }}
