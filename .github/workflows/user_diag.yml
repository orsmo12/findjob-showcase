name: user_diag
on:
  workflow_dispatch:
    inputs:
      idx: { description: "מספר משתמש לפי סדר הרשמה (ריק = האחרון)", default: "" }
      days: { description: "כמה ימים אחורה", default: "10" }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: python -u scripts/user_diag.py "${{ inputs.idx }}" "${{ inputs.days }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
