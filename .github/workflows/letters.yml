name: "findjob assistant (tasks: research, CV tailoring, prep, letters)"
on:
  schedule:
    - cron: "23 5-21/2 * * *"   # כל שעתיים, בערך 07:00–23:00 שעון ישראל: אוסף משימות על משרות ששמרת. בלי משימות — נגמר מהר
  workflow_dispatch:
    inputs:
      user: { description: "רק למשתמש אחד (user_id). ריק = כולם", required: false, default: "" }
concurrency:
  group: findjob-agents-${{ github.event.inputs.user || 'all' }}   # ריצה אחת בכל פעם לכל משתמש (או לכולם). ריצה של משתמש אחד לא מחכה לסריקה של כולם
  cancel-in-progress: false
jobs:
  letters:
    if: github.repository == 'orsmo12/findjob'   # בעותק ציבורי (אם יהיה) הסוכנים לא רצים
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install groq httpx ddgs==9.14.4
      - run: python -u scripts/assistant_job.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_USER: ${{ github.event.inputs.user }}
