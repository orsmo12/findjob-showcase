let lastRemoved=null;
/* האם המשרה עדיין פתוחה: מה שדורון בדק בבוקר */
function openTxt(j){const c=j.check;if(!c)return`${escB(N('hunter'))} יבדוק מחר בבוקר`;
  const d=agoTxt(daysSince(c.at));
  return c.st==='open'?`כן, נבדק ${escB(d)}`:c.st==='unknown'?`לא הצלחתי לבדוק (האתר לא ענה${c.n>1?` ${c.n} פעמים`:''}). כדאי לפתוח ולבדוק`:'נסגרה'}
async function markClosed(id){track('job_closed_btn');const a=appOf(id);if(!a)return;const j=JOBS[a.jobId],now=new Date().toISOString();
  j.closed_at=now;closedToHistory();save();closeSheet();refreshApps();
  if(CLOUDM&&ME){try{const {data}=await SB.from('jobs').select('card').eq('user_id',ME.id).eq('id',a.jobId).maybeSingle();
    if(data)await SB.from('jobs').update({card:Object.assign({},data.card,{closed_at:now,closed_by:'user'})}).eq('user_id',ME.id).eq('id',a.jobId)}catch(e){console.warn(e)}}}
function removeApp(id){
  const a=appOf(id);if(!a)return;const j=JOBS[a.jobId];
  S.apps=S.apps.filter(x=>x.id!==id);S.history=S.history||[];
  S.history.unshift({jobId:a.jobId,co:j.co,title:j.title,url:j.url,reason:'removed',date:new Date().toISOString(),app:a});
  if(S.decisions[a.jobId]==='save')S.decisions[a.jobId]='removed';  // הסוכנים מפסיקים לעבוד עליה
  lastRemoved=a.jobId;save();refreshApps();
  toast(`${j.title} הוסרה מההגשות`,{undo:()=>restoreApp(lastRemoved),ms:5200});
}
function restoreApp(jobId){
  const h=(S.history||[]).find(x=>x.jobId===jobId);if(!h)return;
  if(h.reason==='closed'){toast('המשרה נסגרה, אי אפשר להחזיר אותה להגשות');return}
  S.history=S.history.filter(x=>x!==h);
  S.apps.unshift(h.app||{id:'a-'+jobId,jobId,status:'saved',date:new Date().toISOString(),letter:''});
  S.decisions[jobId]='save';save();refreshApps();toast('המשרה חזרה להגשות');
}
function historyHtml(onlyIfAny){
  const H=(S.history||[]).filter(h=>JOBS[h.jobId]||h.title);
  if(!H.length)return'';
  const why={closed:'נסגרה למועמדים',removed:'הסרת'};
  return`<details class="history"${onlyIfAny?' open':''}><summary>היסטוריה <b class="num">${H.length}</b></summary>
    ${H.map(h=>`<div class="hist-row"><span class="tx"><b dir="auto">${escB(h.title)}</b><span>${escB(h.co)} · ${why[h.reason]||''} · ${new Date(h.date).toLocaleDateString('he-IL')}</span></span>
      ${h.reason==='removed'?`<button class="btn btn-sm btn-ghost" onclick="restoreApp('${h.jobId}')">להחזיר</button>`:h.url?`<a class="btn btn-sm btn-ghost ext" href="${escB(h.url)}" target="_blank" rel="noopener">למודעה${ICO.open}</a>`:''}</div>`).join('')}
  </details>`;
}
function bindAppSwipes(){
  document.querySelectorAll('#appsList .swipe').forEach(w=>{
    const card=w.querySelector('.app');let x0=null,y0=0,dx=0,drag=false;
    card.addEventListener('pointerdown',e=>{if(e.target.closest('textarea,input'))return;x0=e.clientX;y0=e.clientY;dx=0;drag=false});
    card.addEventListener('pointermove',e=>{if(x0===null)return;const mx=e.clientX-x0,my=e.clientY-y0;
      if(!drag&&Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.4){drag=true;card.setPointerCapture(e.pointerId);w.classList.add('dragging')}
      if(drag){dx=mx;card.style.transform=`translateX(${dx}px)`;w.classList.toggle('arm',Math.abs(dx)>w.offsetWidth*.35)}});
    const end=()=>{if(x0===null)return;x0=null;w.classList.remove('dragging');
      if(drag&&Math.abs(dx)>w.offsetWidth*.35){card.style.transition='transform .2s ease';card.style.transform=`translateX(${dx>0?'110%':'-110%'})`;setTimeout(()=>removeApp(w.dataset.id),180)}
      else{card.style.transition='transform .2s ease';card.style.transform='';setTimeout(()=>card.style.transition='',220)}
      if(drag){card.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault()},{capture:true,once:true})}drag=false;w.classList.remove('arm')};
    card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  });
}

/* ═════════ ערכת הגשה: מה שצריך כדי למלא טופס, במקום אחד ═════════
   הפרטים הקבועים נשמרים בפרופיל (ans.kit). כפתור המילוי ממלא שדות לפי התוויות שלהם, מסמן בצהוב מה שלא בטוח,
   ולעולם לא לוחץ "שלח". את ההגשה עושה המשתמש. */
const KIT_FIELDS=[
  ['full','שם מלא',p=>p.name||''],['first','שם פרטי',p=>p.first||(p.name||'').split(' ')[0]||''],['last','שם משפחה',p=>(p.name||'').split(' ').slice(1).join(' ')],
  ['email','מייל',p=>kitOf(p).email||((typeof ME!=='undefined'&&ME&&ME.email)||'')],['phone','טלפון',p=>kitOf(p).phone||''],
  ['city','עיר',p=>kitOf(p).city||''],['linkedin','LinkedIn',p=>(p.ans||{}).linkedin||''],
  ['github','GitHub',p=>{const g=((p.ans||{}).github||'').trim();return g?(g.startsWith('http')?g:'https://github.com/'+g.replace(/^@/,'')):''}],
  ['site','אתר / תיק עבודות',p=>kitOf(p).site||''],['edu','השכלה',p=>kitOf(p).edu||''],
  ['salary','ציפיות שכר',p=>(p.ans||{}).salaryH||(p.ans||{}).salary||''],['auth','אישור עבודה בישראל',p=>kitOf(p).auth||''],
  ['start','זמינות',p=>(p.ans||{}).start||''],
];
function kitOf(p){return (p.ans||{}).kit||{}}
function kitData(){const p=prof(),o={};KIT_FIELDS.forEach(([k,,f])=>{const v=f(p);if(v&&!/עוד לא|לא בטוח/.test(v))o[k]=v});return o}

function realTargets(){
  if(typeof RUNS==='undefined'||!RUNS)return null;
  const h=RUNS.find(r=>(r.agent||'hunter')==='hunter'&&r.stats&&Array.isArray(r.stats.boards));if(!h)return null;
  const tc=S.targets||{added:[],removed:[]},rem=new Set(tc.removed.map(x=>x.toLowerCase())),seen=new Set();
  const out=h.stats.boards.filter(b=>!rem.has(b.name.toLowerCase())).map(b=>{seen.add(b.name.toLowerCase());return b});
  tc.added.filter(n=>!seen.has(n.toLowerCase())).forEach(n=>out.unshift({name:n,status:'new',why:['הוספת בעצמך']}));
  return out;
}

function onCvFile(inp){

    if(t&&t.trim().length>=CV_MIN){prof().cv=t.slice(0,20000);prof().cvName=f.name;S.cv_err='';track('cv_ok')}
    else{S.cv_err=/\.doc$/i.test(f.name)?'קובץ Word ישן (.doc) לא נקרא כאן. שמור אותו כ-PDF או כ-.docx והעלה שוב, או הדבק את הטקסט למטה.'
      :/\.(jpe?g|png|heic|webp)$/i.test(f.name)?'זו תמונה, ואי אפשר לקרוא ממנה טקסט. העלה PDF או Word, או הדבק את הטקסט למטה.'
      :'לא הצלחתי לקרוא טקסט מהקובץ (אולי זה PDF סרוק). שמור מ-Word כ-PDF, או הדבק את הטקסט למטה.';track('cv_fail',{ext:(f.name.split('.').pop()||'').slice(0,5)})}
    save();afterCv()});
  inp.value='';
}
/* קריאת קורות חיים בדפדפן: PDF (pdf.js), Word (mammoth), טקסט. הקובץ לא נשלח לשום מקום */
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function readCv(f){try{
  if(/\.(txt|md)$/i.test(f.name))return await f.text();
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(base+'pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){const c=await (await doc.getPage(i)).getTextContent();let y=null;
      for(const it of c.items){const ny=it.transform[5];if(y!==null&&Math.abs(ny-y)>3)out+='\n';else if(out&&!out.endsWith(' ')&&!out.endsWith('\n'))out+=' ';out+=it.str;y=ny}out+='\n'}
    return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n')}
  if(/\.docx$/i.test(f.name)){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
}catch(e){console.warn(e)}return''}

      <div class="help">גובר על מה שכתוב בקורות החיים, כי הוא מתעדכן.</div></div>

/* ═════════ chat with the assistant ═════════ */
let chatOpen=false;
const SUGS=['מה כדאי לעשות היום?','איזו משרה הכי מתאימה לי?','בוא נתרגל ראיון'];
function toggleChat(force){
  chatOpen=force===true?true:!chatOpen;$('chatPop').classList.toggle('open',chatOpen);
  $('chatName').textContent=N('assistant');
  if(chatOpen){if(CLOUDM)renderChatHistory();if(!$('chatMsgs').children.length)addMsg('bot',`היי ${prof().first}, אני ${N('assistant')}. אני רואה את המשרות, ההגשות וההכנות שלך, ויכול גם לעדכן דברים באפליקציה, באישור שלך. במה לעזור?`);
    if(CLOUDM)chatSugs();else $('chatSugs').innerHTML=SUGS.map(s=>`<button onclick="chatAsk('${s}')">${s}</button>`).join('');face($('chatFace'),5);setTimeout(()=>$('chatInput').focus(),260)}
}
function addMsg(who,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('chatMsgs').appendChild(d);$('chatMsgs').scrollTop=1e6}
function chatAsk(t){$('chatInput').value=t;sendChat()}
function sendChat(){
  const v=$('chatInput').value.trim();if(!v)return;addMsg('me',v);$('chatInput').value='';
  if(CLOUDM){cloudChat(v);return}
  const q=queue();let r;
  if(/היום|לעשות|כדאי/.test(v)){const n=nextSteps();r=n.length?'הכי חשוב עכשיו:\n'+n.slice(0,3).map((x,i)=>`${i+1}. ${x.b}`).join('\n'):'אין משהו דחוף. זה זמן טוב לעבור על בנק הסיפורים בפרופיל.'}
  else if(/מתאימ|משרה/.test(v)) r=q.length?`הכי חזקה כרגע: ${JOBS[q[0]].title} ב-${JOBS[q[0]].co}, התאמה ${JOBS[q[0]].fit} מתוך 5. ${JOBS[q[0]].reasons[0]}.`:'עברת על כל המשרות של היום. בהגשות יש משרות ששמרת ומחכות להגשה.';
  else if(/ראיון|תרגל|סינון/.test(v)) r='נתחיל. איך היית מתכנן מערכת התראות לבורד עם מיליון משתמשים? כתוב את הרכיבים הראשונים, ואני אגיב.';
  else r='רשמתי. ברגע שהסוכנים יהיו מחוברים, אענה מהנתונים האמיתיים שלך.';
  setTimeout(()=>addMsg('bot',r),550);
}

/* ═════════ מה דורון למד ממך: מהמשרות ששמרת, מהדילוגים ומסיבות הדילוג (agent_core/taste.py) ═════════
   מוצג בשקיפות, וכל פריט אפשר לבטל (state.taste_off). משפיע רק על אילו משרות מגיעות לדירוג, לא על הציון. */
function tasteNow(){const r=(typeof RUNS!=='undefined'&&RUNS||[]).find(x=>x.agent==='hunter'&&x.plan&&x.plan.taste);return r?r.plan.taste:null}
function tasteHtml(){const t=tasteNow(),off=new Set((S.taste_off||[]).map(x=>String(x).toLowerCase()));if(!t)return'';
  const chip=(w,cls)=>off.has(String(w).toLowerCase())?'':`<span class="taste-chip ${cls}">${escB(w)}<button aria-label="לבטל את ${escB(w)}" onclick="tasteOff('${escB(w).replace(/'/g,"\\'")}')">✕</button></span>`;
  const rows=[[t.likes,'like','עולות בעדיפות: משרות עם'],[t.dislikes,'dis','יורדות בעדיפות: משרות עם'],[t.avoid_cos,'dis','חברות שדילגת עליהן'],[t.avoid_locs,'dis','מקומות שדילגת עליהם']]
    .filter(([xs])=>(xs||[]).some(w=>!off.has(String(w).toLowerCase())));
  if(!rows.length)return`<h3 class="sub-h">מה ${escB(N('hunter'))} למד ממך</h3><p class="help">עוד מעט: אחרי עוד כמה שמירות ודילוגים ${escB(N('hunter'))} יתחיל להתאים לך את הסדר.</p>`;
  return`<h3 class="sub-h">מה ${escB(N('hunter'))} למד ממך</h3><p class="help">מהמשרות ששמרת ומהדילוגים. משנה רק את הסדר שבו משרות נבדקות, לא את הציון. אפשר לבטל כל פריט.</p>
    ${rows.map(([xs,cls,l])=>`<div class="taste-row"><span>${l}</span><div>${xs.map(w=>chip(w,cls)).join('')}</div></div>`).join('')}`}
function tasteOff(w){S.taste_off=[...new Set([...(S.taste_off||[]),w])];save();renderProfile();toast(`${N('hunter')} לא ישתמש יותר ב"${w}" מהסריקה הבאה`)}

/* ═════════ סיור באפליקציה (בסגנון TipKit) ═════════
   מצביע על הכפתורים האמיתיים, ומותאם למצב של המשתמש: משרות שמחכות, סריקה ראשונה שרצה, קורות חיים חסרים, התחום.
   סיור ראשי פעם אחת, וטיפ קצר בפעם הראשונה שנכנסים לכל מסך. כל צעד נמדד (track) כדי ללמוד איפה נוטשים. */
const tv=x=>typeof x==='function'?x():x;
function tourMain(){const q=queue().length,a=ans(),sw=domainOf(a)==='פיתוח תוכנה',scan=typeof _prep!=='undefined'&&_prep&&_prep.scan,hasCv=!!(prof().cv||prof().cvName);
  return [

     :scan?{sel:'#prepBar',t:`${N('hunter')} כבר מחפש`,d:'הסריקה הראשונה שלך רצה עכשיו. בעוד כמה דקות יופיעו כאן המשרות הראשונות.'}
     :{sel:'#menuBtn',t:'משרות',d:`${N('hunter')} מחפש פעמיים ביום. כשיש משרות חדשות, מופיע מספר על התפריט.`},
    {sel:'.next',t:'הצעדים הבאים',d:'מה כדאי לעשות עכשיו, לפי סדר חשיבות. לחיצה מובילה ישר למקום.'},
    {sel:'#chatBtn',t:`${N('assistant')} עונה על הכל`,d:'איך משהו עובד באפליקציה, איזו משרה מתאימה, תרגול ראיון, שאלה מטופס הגשה, או לשנות הגדרות חיפוש. הוא מבקש אישור לפני כל שינוי.'},
    hasCv?{sel:'#tbAvatar',t:'הפרופיל שלך',d:`כדאי להשלים "פרטים לטפסי הגשה"${sw?'':' ותיק עבודות'}. ככה ערכת ההגשה מוכנה, והמכתבים מדויקים יותר.`}
         :{sel:'#tbAvatar',t:'חסרים קורות חיים',d:'בלי קורות חיים הסוכנים לא יכולים לדרג משרות או לכתוב מכתבים. מעלים בפרופיל, לוקח דקה.'},
    {sel:'#menuBtn',t:'הכל בתפריט',d:'משרות, הגשות, הכנה לראיון, LinkedIn והמשרד. שום דבר לא נשלח בשמך בלי שתלחץ בעצמך. הסיור נפתח שוב מהתפריט.'},
  ].filter(Boolean)}
const PAGE_TIPS={
  jobs:[{sel:'#deck .jcard',t:'ככה מחליטים',d:'ימינה = לשמור (הצוות מכין מכתב, סקירה והכנה). שמאלה = לדלג. לחיצה על הכרטיס = כל הפרטים ולמה הציון.'},
        {sel:'#addJobBtn',t:'מצאת משרה בעצמך?',d:'מדביקים קישור, ודורון מדרג אותה כמו כל משרה אחרת.'}],
  apps:[{sel:'#appsList .app',t:'המשרות ששמרת',d:'בכל משרה: ערכת הגשה (מכתב, פרטים, מילוי טופס), הכנה לראיון וסקירת החברה. מסמנים "הגשתי" אחרי ששלחת.'},
        {sel:'#appsList > .btn',t:'לא רוצה לחכות?',d:'"לעדכן הכל עכשיו" מריץ את הסוכנים רק בשבילך. בדרך כלל 2 עד 4 דקות.'}],
  profile:[{sel:'#planCard',t:'מה מחפשים בשבילך',d:'כאן רואים ומשנים תפקידים, אזורים, חברות יעד וערוצי טלגרם. אפשר גם פשוט לבקש מ'+N('assistant')+' בצ׳אט.'}],
};
let tourSteps=[],tourI=-1,tourKind='';
function tourStart(kind){kind=kind||'main';if(kind==='main'){if(curPg!=='main')goPage('main');closeDrawer&&closeDrawer()}
  /* רק אלמנטים שבאמת נראים עכשיו: מסכים אחרים קיימים בדף אבל מוסתרים (טיפ של "הגשות" הופיע מעל LinkedIn) */
  tourSteps=(kind==='main'?tourMain():PAGE_TIPS[kind]||[]).filter(st=>tourVisible(document.querySelector(st.sel)));if(!tourSteps.length)return;
  tourKind=kind;tourI=0;track('tour_start',{k:kind});setTimeout(tourShow,kind==='main'?150:450)}
const tourVisible=el=>{if(!el||el.offsetParent===null)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0};
/* עברו למסך אחר באמצע טיפ של מסך: סוגרים בלי לסמן שנראה, כדי שיופיע בפעם הבאה במקום הנכון */
function tourAbortFor(pg){if(tourI<0||tourKind==='main'||tourKind===pg)return;const k=tourKind;tourI=-1;S.tips=S.tips||{};S.tips[k]=0;save();$('tour')&&$('tour').remove();document.removeEventListener('keydown',tourKey)}
function pageTip(pg){if(!PAGE_TIPS[pg]||tourI>=0)return;S.tips=S.tips||{};if(S.tips[pg])return;
  setTimeout(()=>{if(curPg===pg&&tourI<0&&!document.querySelector('.sheet.on, #onb.on')){S.tips[pg]=1;save();tourStart(pg)}},700)}
function tourEnd(done){const k=tourKind;track(done?'tour_done':'tour_skip',{k,at:tourI,of:tourSteps.length});
  tourI=-1;if(k==='main')S.tourDone=true;else{S.tips=S.tips||{};S.tips[k]=1}save();$('tour')&&$('tour').remove();document.removeEventListener('keydown',tourKey)}
function tourKey(e){if(e.key==='Escape')tourEnd(false);if(e.key==='ArrowLeft'||e.key==='Enter'){e.preventDefault();tourNext()}if(e.key==='ArrowRight'&&tourI>0){tourI--;tourShow()}}
function tourNext(){tourI++;tourI>=tourSteps.length?tourEnd(true):tourShow()}
function tourShow(){
  if(tourKind!=='main'&&curPg!==tourKind){tourAbortFor(curPg);return}
  const st=tourSteps[tourI],el=document.querySelector(st.sel);if(!tourVisible(el)){tourNext();return}
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  el.scrollIntoView({block:'center',behavior:rm?'auto':'smooth'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),pad=8,vh=innerHeight,below=r.top+r.height/2<vh/2;
    let w=$('tour');if(!w){w=document.createElement('div');w.id='tour';document.body.appendChild(w);document.addEventListener('keydown',tourKey)}
    const last=tourI===tourSteps.length-1,ax=Math.max(28,Math.min(innerWidth-28,r.left+r.width/2));
    w.innerHTML=`<div class="tour-hole${rm?'':' pulse'}" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
      <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourT" aria-describedby="tourD" style="top:0;visibility:hidden;--ax:${ax}px">
        <div class="tour-top"><span class="tour-n">${tourI+1} מתוך ${tourSteps.length}</span><button class="tour-x" aria-label="לסגור את הסיור" onclick="tourEnd(false)">✕</button></div>
        <b id="tourT">${escB(tv(st.t))}</b><p id="tourD">${escB(tv(st.d))}</p>
        <div class="tour-foot"><span class="tour-dots" aria-hidden="true">${tourSteps.map((_,i)=>`<i${i===tourI?' class="on"':i<tourI?' class="done"':''}></i>`).join('')}</span>
          <span>${tourI>0?`<button class="btn btn-sm btn-ghost" onclick="tourI--;tourShow()">הקודם</button>`:`<button class="btn btn-sm btn-ghost" onclick="tourEnd(false)">דלג</button>`}<button class="btn btn-sm tour-go" id="tourNext" onclick="tourNext()">${last?'הבנתי':'הבא'}</button></span></div></div>`;
    tourPlace(w.querySelector('.tour-card'),r,pad,below);$('tourNext').focus()},rm?40:320)}
/* החלון תמיד כולו בתוך המסך: מתחת למטרה אם יש מקום, אחרת מעליה, ואם המטרה גדולה מדי (כרטיס משרה) — מעליה בתחתית המסך */
function tourPlace(c,r,pad,below){const vh=innerHeight,m=12,gap=pad+14,h=Math.min(c.offsetHeight,vh-2*m);

async function runAction(x){

    <p class="sheet-sub" style="margin-bottom:12px">מצאת משרה בעצמך? הדבק את הקישור. ${escB(N('hunter'))} ידרג אותה מול קורות החיים שלך, והיא תיכנס להגשות: ${escB(N('assistant'))} יכין מכתב, ${escB(N('researcher'))} סקירה ו${escB(N('coach'))} שאלות הכנה.</p>
    <div class="field"><label for="ajUrl">קישור למשרה</label><input id="ajUrl" class="ltr" type="url" inputmode="url" placeholder="https://www.linkedin.com/jobs/view/…" autocomplete="off"></div>
    <div class="field" id="ajTextWrap" hidden><label for="ajText">תיאור המשרה</label><textarea id="ajText" class="textbox" rows="7" placeholder="האתר לא נתן לקרוא את המשרה. העתק לכאן את כל הטקסט שלה."></textarea></div>
    <div class="help" id="ajHelp"></div>
    <button class="btn btn-primary btn-block" id="ajBtn" style="margin-top:12px" onclick="submitAddJob()">הוספה</button>`);
  setTimeout(()=>{const i=$('ajUrl');i&&i.focus();navigator.clipboard&&navigator.clipboard.readText&&navigator.clipboard.readText().then(t=>{if(/^https?:\/\//.test(t||'')&&i&&!i.value)i.value=t.trim()}).catch(()=>{})},200);
}
async function submitAddJob(){track('add_job');
  const url=($('ajUrl').value||'').trim(),text=($('ajText').value||'').trim(),h=$('ajHelp'),btn=$('ajBtn');
  if(!/^https?:\/\//.test(url)&&text.length<200){h.textContent='צריך קישור שמתחיל ב-https://';h.style.color='var(--rose)';return}
  btnBusy(btn,true);h.style.color='';const stop=stages(h,[`${N('hunter')} פותח את הקישור…`,'קורא את המודעה המלאה…','מדרג מול קורות החיים שלך: כישורים ורמת ניסיון…','עוד רגע, כותב למה זה מתאים ומה חסר…'],4000);
  let d={};
  try{const {data:{session}}=await SB.auth.getSession();
    const r=await fetch('/api/addjob',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,text,token:session&&session.access_token})});
    d=await r.json().catch(()=>({}));if(!r.ok&&!d.error)d.error='http'}catch(e){d={error:'net'}}
  stop();btnBusy(btn,false);
  if(d.need_text){$('ajTextWrap').hidden=false;h.style.color='var(--ink2)';h.textContent='האתר לא מאפשר לקרוא את המשרה ישירות. העתק לשדה את התיאור שלה, ולחץ שוב על "הוספה".';$('ajText').focus();return}
  if(d.not_job){h.style.color='var(--rose)';h.textContent='זה לא נראה כמו מודעת משרה. בדוק את הקישור.';return}
  if(!d.card){h.style.color='var(--rose)';h.textContent=d.error==='auth'?'צריך להתחבר מחדש.':'משהו השתבש. נסה שוב בעוד דקה.';return}
  const c=Object.assign({},d.card,{letter:null,brief:null,prep:null});
  JOBS[c.id]=fromFeed({jobs:[c]})[c.id];if(!DECK.includes(c.id))DECK.push(c.id);
  S.decisions[c.id]='save';_decSnap[c.id]='save';
  if(!S.apps.find(a=>a.jobId===c.id))S.apps.unshift({id:'a-'+c.id,jobId:c.id,status:'saved',date:new Date().toISOString(),letter:''});
  save();closeSheet();
  toast(`${c.title} ב-${c.co}: התאמה ${c.fit} מתוך 5. נכנסה להגשות.${c.level_gap?' שים לב: '+c.level_gap+'.':''}`,{ms:5200});
  goPage('apps');setTimeout(()=>openApp('a-'+c.id,'details'),250);
}

/* משרה שנסגרה: אם עוד לא הגשת — יוצאת מההגשות להיסטוריה. אם כבר הגשת — נשארת, עם סימון */
function closedToHistory(){
  S.history=S.history||[];const moved=[];
  S.apps=S.apps.filter(a=>{const j=JOBS[a.jobId];if(a.status==='saved'&&j&&j.closed_at){
    S.history.unshift({jobId:a.jobId,co:j.co,title:j.title,url:j.url,reason:'closed',date:j.closed_at});moved.push(j);return false}return true});
  if(moved.length)setTimeout(()=>toast(moved.length===1?`${moved[0].title} ב-${moved[0].co} נסגרה למועמדים. העברתי להיסטוריה.`:`${moved.length} משרות ששמרת נסגרו. העברתי להיסטוריה.`,{ms:5200}),1600);
}
/* מטלה אחרת: קודם מהמאגר שמאיה כבר הכינה, ואם נגמר — בקשה למטלות נוספות */
async function requestMoreTasks(jobId){
  const j=JOBS[jobId];if(!j||!j.prep)return;
  j.prep=Object.assign({},j.prep,{more_tasks:true});
  const {error}=await SB.from('jobs').update({prep:j.prep}).eq('user_id',ME.id).eq('id',jobId);
  toast(error?'לא הצלחתי לבקש. נסה שוב':`${N('coach')} תביא מטלות נוספות תוך שעתיים בערך`);renderPrep();
}

/* הישיבה השבועית של הצוות: דוח מצב, מה שונה, והצעות לאישור */
function lastMeeting(){return (typeof RUNS!=='undefined'&&RUNS||[]).find(r=>r.agent==='strategist'&&r.stats&&r.stats.report)||null}
function pendingSuggestions(){const m=lastMeeting();if(!m)return[];const acc=new Set((S.accepted||[]).map(x=>x.value.toLowerCase())),dis=new Set((S.dismissed||[]).map(x=>x.toLowerCase()));
  return (m.stats.report.suggestions||[]).filter(s=>!acc.has(s.value.toLowerCase())&&!dis.has(s.value.toLowerCase()))}
function acceptSuggestion(v){S.accepted=S.accepted||[];if(!S.accepted.some(x=>x.value===v))S.accepted.push({type:'role',value:v,at:new Date().toISOString()});save();toast(`${v} נוסף לחיפוש. ${N('hunter')} יחפש אותו מהסריקה הבאה`);renderProfile&&renderProfile();if($('sheet').classList.contains('open'))openMeeting()}
function dismissSuggestion(v){S.dismissed=S.dismissed||[];if(!S.dismissed.includes(v))S.dismissed.push(v);save();renderProfile&&renderProfile();if($('sheet').classList.contains('open'))openMeeting()}
function suggestionsHtml(){const L=pendingSuggestions();if(!L.length)return'';
  return `<h3 class="sub-h">הצעות מהישיבה של הצוות</h3>`+L.map(s=>`<div class="sg-card"><b lang="en">${escB(s.value)}</b><p>${escB(s.why)}</p>
    ${(s.examples||[]).length?`<ul class="sg-ex">${s.examples.map(e=>`<li><span lang="en">${escB(e.title)}</span> · ${escB(e.co)} · ${Number(e.fit).toFixed(1)}</li>`).join('')}</ul>`:''}
    ${(s.needs||[]).length?`<p class="sg-need">מה מבקשים שם ולא מופיע אצלך: <span lang="en">${escB(s.needs.join(', '))}</span></p>`:''}
    <div class="sg-btns"><button class="btn btn-sm btn-primary" onclick="acceptSuggestion('${escB(s.value).replace(/'/g,"\\'")}')">להוסיף לחיפוש</button><button class="btn btn-sm btn-ghost" onclick="dismissSuggestion('${escB(s.value).replace(/'/g,"\\'")}')">לא מעניין</button></div></div>`).join('')}
function openMeeting(){const m=lastMeeting();if(!m)return;const r=m.stats.report,d=new Date(m.created_at);
  const li=a=>a&&a.length?`<ul class="plan-list">${a.map(x=>`<li>${escB(x)}</li>`).join('')}</ul>`:'<p class="card-sub">אין.</p>';
  const pct=r.collected?Math.round(100*r.too_senior/r.collected):0;
  openSheet(`<h3 id="sheetTitle">הישיבה השבועית</h3><div class="sheet-sub">${escB(N('strategist'))} והצוות · ${d.toLocaleDateString('he-IL')}</div>
    <div class="mt-grid"><div><b>${r.scans}</b><span>סריקות</span></div><div><b>${r.collected}</b><span>משרות נאספו</span></div><div><b>${pct}%</b><span>בכירות מדי</span></div><div><b>${r.shown}</b><span>הוצגו לך</span></div>
      <div><b>${r.avg_fit==null?'—':r.avg_fit}</b><span>ציון ממוצע</span></div><div><b>${r.boards_ok}/${r.boards_total}</b><span>דפי קריירה נסרקים</span></div></div>
    <div class="s-sec"><h4>מה שמנו לב</h4>${li(r.issues)}</div>
    <div class="s-sec"><h4>מה שינינו לבד</h4>${li(r.actions)}</div>
    ${(r.skill_gaps||[]).length?`<div class="s-sec"><h4>כישורים שחסרים שוב ושוב</h4><p class="card-sub">במשרות שמתאימות לך. ${escB(N('coach'))} מכינה על זה חומר.</p><div class="learned">${r.skill_gaps.map(g=>`<span class="chip" lang="en">${escB(g.skill)} · ${g.jobs}</span>`).join('')}</div></div>`:''}
    <div class="s-sec">${suggestionsHtml()||'<h4>הצעות</h4><p class="card-sub">אין הצעות פתוחות.</p>'}</div>`)}

/* קובי: מה עשית ב-GitHub ולא כתוב בקורות החיים. אתה בוחר, רואה את השינוי, ומאשר */
function saveGithub(){const v=($('ghIn').value||'').trim().replace(/^@/,'').split('/').pop();const p=prof();p.ans=p.ans||{};p.ans.github=v;save();toast(v?`${N('linkedin')} יעבור על ה-GitHub שלך בשעתיים הקרובות`:'נמחק')}
function lastCvSuggest(){return (RUNS||[]).find(r=>r.agent==='linkedin'&&r.stats&&Array.isArray(r.stats.cv_suggest))||null}
const cvKey=x=>x.kind==='skill'?'skill:'+x.skill:x.line;
function cvPending(){const r=lastCvSuggest();if(!r)return[];const done=new Set(S.cvDone||[]);return r.stats.cv_suggest.filter(x=>!done.has(cvKey(x)))}
/* בפרופיל: שורה קצרה. הרשימה המלאה נפתחת בחלון */
function cvSuggestHtml(){const L=cvPending();if(!L.length)return'';const sk=L.filter(x=>x.kind==='skill').length,ln=L.length-sk;
  return `<button class="cvs-open" onclick="openCvSuggest()"><span><b>${escB(N('linkedin'))} מצא ${L.length} תוספות לקורות החיים</b><em>${[ln?`${ln} שורות על מה שעשית`:'',sk?`${sk} מילות מפתח לכישורים`:''].filter(Boolean).join(' · ')}. מתוך הריפוזיטוריז שלך ב-GitHub</em></span>${ICO.open||'›'}</button>`}
function openCvSuggest(){const r=lastCvSuggest(),L=cvPending();if(!L.length)return;
  const row=x=>`<label class="cvs-row"><input type="checkbox" class="cvs-ck" data-i="${r.stats.cv_suggest.indexOf(x)}" checked>
    <span><b dir="ltr" lang="en">${escB(x.line)}</b>${x.why?`<em>${escB(x.why)}</em>`:''}<a href="${escB(x.url)}" target="_blank" rel="noopener" lang="en">${escB(x.repo)}${x.proof?' · '+escB(x.proof):''}</a></span></label>`;
  const ln=L.filter(x=>x.kind!=='skill'),sk=L.filter(x=>x.kind==='skill');
  openSheet(`<h3 id="sheetTitle">תוספות לקורות החיים</h3><div class="sheet-sub">${escB(N('linkedin'))} מצא אותן בריפוזיטוריז שלך. רק מה שמופיע שם. מסמנים, רואים את התוצאה, ומאשרים.</div>
    ${ln.length?`<h4 class="sub-h">שורות חדשות</h4>${ln.map(row).join('')}`:''}
    ${sk.length?`<h4 class="sub-h">מילות מפתח לשורת הכישורים</h4>${sk.map(row).join('')}`:''}
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="previewCv()">לראות את קורות החיים המעודכנים</button>`)}
function cvWithAdditions(cv,adds){const lines=cv.split('\n');
  const skills=adds.filter(x=>x.kind==='skill').map(x=>x.skill);
  if(skills.length){let i=lines.findIndex(l=>/skills|technolog|tools|כישורים/i.test(l));
    if(i<0){lines.push('','Skills',skills.join(', '))}
    else{if(!/[:：]\s*\S/.test(lines[i])){let k=i+1;while(k<lines.length&&!lines[k].trim())k++;i=k<lines.length?k:i}
      lines[i]=lines[i].replace(/[\s,;.]*$/,'')+', '+skills.join(', ')}}
  adds.filter(x=>x.kind!=='skill').forEach(x=>{const w=(x.where||'').toLowerCase();let i=w?lines.findIndex(l=>l.toLowerCase().includes(w)):-1;
    if(i<0)i=lines.findIndex(l=>/^\s*projects\b/i.test(l));
    if(i<0){lines.push('','Additional','• '+x.line);return}
    let k=i+1;while(k<lines.length&&lines[k].trim()&&!/^[A-Z][A-Za-z &]{2,30}$/.test(lines[k].trim()))k++;
    lines.splice(k,0,'• '+x.line)});
  return lines.join('\n')}
function previewCv(){const r=lastCvSuggest(),sel=[...document.querySelectorAll('.cvs-ck')].filter(c=>c.checked).map(c=>r.stats.cv_suggest[+c.dataset.i]);
  if(!sel.length){toast('לא סימנת אף שורה');return}const cv=prof().cv||'',nu=cvWithAdditions(cv,sel);window.__cvNew={text:nu,sel};
  const set=new Set(sel.filter(x=>x.kind!=='skill').map(x=>'• '+x.line)),sks=sel.filter(x=>x.kind==='skill').map(x=>x.skill);
  openSheet(`<h3 id="sheetTitle">קורות החיים המעודכנים</h3><div class="sheet-sub">השורות החדשות מסומנות בירוק. שום דבר לא משתנה עד שתאשר.</div>
    <pre class="cv-pre" dir="ltr">${nu.split('\n').map(l=>set.has(l)?`<mark>${escB(l)}</mark>`:sks.some(k=>l.endsWith(k)||l.includes(', '+k+','))?escB(l).replace(new RegExp('(, )('+sks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g'),'$1<mark>$2</mark>'):escB(l)).join('\n')}</pre>
    <div class="duo"><button class="btn btn-ghost" onclick="closeSheet()">ביטול</button><button class="btn btn-primary" onclick="applyCv()">לאשר ולעדכן</button></div>`)}
function applyCv(){const n=window.__cvNew;if(!n)return;prof().cv=n.text;S.cvDone=(S.cvDone||[]).concat(n.sel.map(cvKey));save();
  openSheet(`<h3 id="sheetTitle">קורות החיים עודכנו</h3><div class="sheet-sub">כל הסוכנים עובדים מעכשיו לפי הגרסה החדשה.</div>
    <p style="font-size:14px;margin:12px 0">אפשר לשמור כ-PDF: בחלון ההדפסה בוחרים "שמירה כ-PDF". זה PDF פשוט מהטקסט. אם יש לך קובץ מעוצב, אפשר להעתיק אליו את השורות החדשות.</p>
    <button class="btn btn-primary btn-block" onclick="cvPdf()">ל-PDF</button>`);renderProfile()}
function cvPdf(){const w=window.open('','_blank');if(!w){toast('הדפדפן חסם חלון חדש');return}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>CV</title><style>body{font:12.5px/1.5 Arial,sans-serif;margin:28px;white-space:pre-wrap;direction:ltr}</style></head><body>${escB(prof().cv||'')}</body></html>`);w.document.close();setTimeout(()=>w.print(),300)}

/* נתוני שימוש בסיסיים (ספירות בלבד, בלי תוכן) כדי שנדע מה עובד ומה לשפר */


/* דוח שימוש (רק לבעל המערכת) */
/* דוח משתמשים לבעל המערכת: כרטיס אחד לכל משתמש, רק מה שעוזר להחליט.
   מצב (תקין / צריך תשומת לב ולמה), 4 מספרים, שורת חיפוש אחת, והפעילות של הסוכנים מקופלת. */
const agName=k=>{try{return N(k)||k}catch(e){return k}};
const fmtT=t=>t?new Date(t.length<=16?t+'Z':t).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function usState(x){const s=x.search||{};
  if(!x.cv_len)return['warn','אין קורות חיים'];
  if(s.fails_24h)return['warn',`${s.fails_24h} תקלות ב-24 שעות`];
  if(!s.last_scan)return['wait','עוד לא הייתה סריקה'];
  if(x.stuck&&!/^לפני: (ראה משרות|שמר משרה)$/.test(x.stuck)&&!x.stuck.startsWith('אין קורות'))return['wait',x.stuck.replace(/^לפני: /,'עוד לא: ')];
  return['ok','תקין']}
function usCard(x){const s=x.search||{},[st,stl]=usState(x),d=(x.domain||'').trim();
  return `<article class="usc">
    <header><b>${escB(x.name)}</b><span class="usc-st ${st}">${escB(stl)}</span></header>
    <div class="usc-meta">${[d,x.own_key?'מפתח אישי':'מכסה משותפת','נכנס לאחרונה '+escB(x.last?x.last.split('-').reverse().slice(0,2).join('.'):'—')].filter(Boolean).map(escB).join(' · ')}</div>
    <div class="usc-nums"><div><b class="num">${x.waiting}</b><span>ממתינות</span></div><div><b class="num">${x.saved}</b><span>שמורות</span></div><div><b class="num">${x.applied}</b><span>הגשות</span></div><div><b class="num">${x.days_week}</b><span>ימים השבוע</span></div></div>
    ${s.last_scan?`<div class="usc-scan"><span>סריקה אחרונה ${escB(fmtT(s.last_scan))}</span><span class="usc-flow num">${s.collected} נאספו <i>‹</i> ${s.rated} נבדקו <i>‹</i> <b>${s.shown} הוצגו</b></span></div>`:''}
    ${(s.recent||[]).length?`<details class="usc-act"><summary>פעילות הסוכנים</summary><ul>${s.recent.map(m=>`<li><time>${escB(fmtT(m.at))}</time><span><b>${escB(agName(m.a))}</b> ${escB(m.m)}</span></li>`).join('')}</ul></details>`:''}
  </article>`}
function openUsage(){const r=(RUNS||[]).find(x=>x.stats&&x.stats.usage_report);if(!r)return;const u=r.stats.usage_report;
  openSheet(`<h3 id="sheetTitle">משתמשים</h3><div class="sheet-sub">עודכן ${escB(fmtT(r.created_at))}, אחרי כל סריקה. ספירות בלבד, בלי תוכן.</div>
  <div class="usc-list">${u.rows.map(usCard).join('')}</div>
  ${(u.feedback||[]).length?`<h4 class="sub-h">משוב</h4>${u.feedback.map(f=>`<p class="us-fb"><b>${escB(f.name)}</b> · ${escB(f.at)}<br>${escB(f.t)}</p>`).join('')}`:''}`)}

/* מפתח AI אישי (Groq, חינם): כל משתמש מקבל מכסה משלו, והסוכנים שלו לא מחכים בתור */

/* ═════════ מפתח AI אישי: Groq / Gemini (חינם) או Claude / OpenAI (בתשלום) ═════════

let _prep=null;
async function prepNow(kind){kind=kind==='scan'?'scan':'prep';
  if(_prep){toast('הסוכנים כבר עובדים. אפשר להמשיך להשתמש באפליקציה');return}
  closeSheet();let d={},r;
  try{const {data:{session}}=await SB.auth.getSession();
    r=await fetch('/api/prepnow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:session&&session.access_token,kind})});d=await r.json()}catch(e){}
  if(!r||!d.ok){if(d.error==='no_cv'){toast(`צריך קודם קורות חיים. בלעדיהם ${N('hunter')} לא יכול לחפש`);goPage('profile');return}toast(d.error==='wait'?`אפשר להפעיל פעם ב-10 דקות. עוד ${d.minutes} דק׳`:d.error==='no_token'?'הכפתור עוד לא מחובר. המפתח צריך להשלים הגדרה אחת':d.error==='auth'?'צריך להתחבר מחדש':'לא הצלחתי להפעיל. נסה שוב בעוד דקה');return}
  track(kind==='scan'?'scan_first':'prep_now');_prep={at:d.at,t0:Date.now(),scan:kind==='scan'};prepBar();if(curPg==='jobs')renderJobs();_prep.timer=setInterval(prepPoll,15000);
}
function prepBar(done){let b=$('prepBar');if(!b){b=document.createElement('div');b.id='prepBar';b.setAttribute('role','status');document.body.appendChild(b)}
  if(done){b.innerHTML=_prep&&_prep.scan?`<b>מוכן ✓</b><span>המשרות הראשונות מחכות לך במסך המשרות.</span>`:`<b>מוכן ✓</b><span>הכל עודכן. המכתבים, הסקירות וההכנה מחכים בהגשות.</span>`;b.classList.add('done');setTimeout(()=>b.remove(),6000);return}
  const p=Math.min(92,Math.round((Date.now()-_prep.t0)/(_prep.scan?9000:2400)));
  b.innerHTML=_prep.scan?`<b>${LD('ld-s')} ${escB(N('hunter'))} מחפש לך משרות ראשונות</b><span>בדרך כלל 8 עד 15 דקות. אפשר לסגור את האפליקציה, הכל יחכה כאן.</span><i><u style="width:${p}%"></u></i>`
    :`<b>${LD('ld-s')} הסוכנים עובדים בשבילך</b><span>בדרך כלל 2 עד 4 דקות. בסיום הכל יופיע בהגשות ובמשרד.</span><i><u style="width:${p}%"></u></i>`}

const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function pushToggle(){

  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;

  if(!VAPID_PUB||!('PushManager' in window)){toast(VAPID_PUB?'הדפדפן הזה לא תומך בהתראות':'ההתראות עוד לא מחוברות. המפתח צריך להשלים הגדרה אחת');return}

/* שי משנה הגדרות חיפוש, רק אחרי אישור בכרטיס */
const AREAS=['תל אביב','גוש דן והמרכז','השרון','ירושלים','חיפה והצפון','באר שבע והדרום'],MODES=['מהמשרד','היברידי','מהבית','לא משנה לי'],SALS=['עד ₪12K','₪12–16K','₪16–20K','₪20–25K','₪25K ומעלה'];
function setPref(x){const p=prof();p.ans=p.ans||{};const a=p.ans,clean=v=>String(v||'').trim().slice(0,60),T=S.targets=S.targets||{added:[],removed:[]};
  const lower=(L,v)=>L.findIndex(y=>y.toLowerCase()===v.toLowerCase());
  switch(x.type){
    case 'add_role':{const r=clean(x.role);if(!r)return false;a.roles=a.roles||[];if(lower(a.roles,r)<0)a.roles.push(r);return true}
    case 'remove_role':{const i=lower(a.roles||[],clean(x.role));if(i<0)return false;a.roles.splice(i,1);return true}
    case 'add_target':{const n=clean(x.name);if(!n)return false;T.removed=T.removed.filter(v=>v.toLowerCase()!==n.toLowerCase());if(lower(T.added,n)<0)T.added.unshift(n);return true}
    case 'remove_target':{const n=clean(x.name);if(!n)return false;T.added=T.added.filter(v=>v.toLowerCase()!==n.toLowerCase());if(lower(T.removed,n)<0)T.removed.push(n);return true}
    case 'set_area':{const L=(x.locs||[]).filter(v=>AREAS.includes(v));if(!L.length)return false;a.locs=L;return true}
    case 'set_mode':if(!MODES.includes(x.mode))return false;a.mode=x.mode;return true;
    case 'add_exclude':{const w=clean(x.word);if(!w)return false;a.exclude=a.exclude||[];if(lower(a.exclude,w)<0)a.exclude.push(w);return true}
    case 'remove_exclude':{const i=lower(a.exclude||[],clean(x.word));if(i<0)return false;a.exclude.splice(i,1);return true}
    case 'set_salary':if(!SALS.includes(x.salary))return false;a.salary=x.salary;return true;
    case 'add_channel':{const ch=chName(x.channel);if(!ch)return false;a.telegram=a.telegram||[];if(!a.telegram.includes(ch))a.telegram.push(ch);return true}
  }return false}

    ${(RUNS||[]).find(x=>x.stats&&x.stats.insights)?`<button class="btn btn-sm btn-ghost btn-block" onclick="openInsights()">תובנות שבועיות על החיפוש</button>`:''}
    ${(u.funnel||[]).length?`<h4 class="sub-h">משפך: כמה משתמשים הגיעו לכל שלב</h4><div class="dev-fun">${u.funnel.map(([l,n])=>`<div><span>${escB(l)}</span><i style="width:${u.rows.length?Math.round(100*n/u.rows.length):0}%"></i><b class="num">${n}</b></div>`).join('')}</div>`:''}
    ${(u.errors||[]).length?`<h4 class="sub-h">שגיאות באפליקציה אצל משתמשים</h4><ul class="dev-err">${u.errors.map(([m,n])=>`<li><b class="num">${n}×</b> <span dir="ltr">${escB(m)}</span></li>`).join('')}</ul>`:''}
    <h4 class="sub-h">משובים ובקשות</h4>
    ${fb.length?fb.map(f=>`<div class="dev-fb"><div><b>${escB(f.name)}</b> · ${escB(f.at)}</div><p>${escB(f.t)}</p>
      <label class="vh" for="fb-${escB(f.key)}">סטטוס</label><select id="fb-${escB(f.key)}" onchange="setFbStatus('${escB(f.key)}',this.value)">${Object.entries(FB_ST).map(([k,l])=>`<option value="${k}"${(st[f.key]||'')===k?' selected':''}>${l}</option>`).join('')}</select></div>`).join('')
      :'<p class="card-sub">אין משובים מהחודש האחרון.</p>'}
    <p class="card-sub">כשמשנים סטטוס, המשתמש מקבל הודעה בסריקת הבוקר.</p>
    <h4 class="sub-h">ריצות עם תקלות (14 ימים)</h4>
    ${fails.length?fails.map(r=>`<div class="dev-fb"><div><b>${escB(r.stats.job||'ריצה')}</b> · ${new Date(r.created_at).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}${r.stats.run?` · <a class="ext" href="${escB(r.stats.run)}" target="_blank" rel="noopener">ליומן</a>`:''}</div>
      <ul>${r.stats.failures.slice(0,6).map(f=>`<li dir="auto">${escB(f.where)} · ${escB(f.user)} · <span dir="ltr">${escB(f.error)}</span></li>`).join('')}</ul></div>`).join('')
      :'<p class="card-sub">אין תקלות. הכל רץ.</p>'}`)}
function setFbStatus(k,v){S.fb_status=Object.assign({},S.fb_status);if(v)S.fb_status[k]=v;else delete S.fb_status[k];save();toast('נשמר. המשתמש יקבל עדכון בבוקר')}

cloudBoot();
</script>
</body>
</html>
