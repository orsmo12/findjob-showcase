    <div class="todo-head"><h2>המשימות שלי</h2><span class="num">${left?`${left} פתוחות`:'הכל בוצע'}</span></div>
    <div id="todoList" role="list">${show.map(t=>`
      <div class="todo-item" role="listitem" data-id="${t.id}">
        <button class="tcheck${t.done?' done':''}" role="checkbox" aria-checked="${t.done}" aria-label="${escB(t.text)}" onclick="toggleTodo('${t.id}')"></button>
        <span class="ttext${t.done?' done':''}">${escB(t.text)}</span>
        <button class="thandle" aria-label="גרירה לשינוי הסדר" tabindex="-1"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
      </div>`).join('')}</div>
    <div class="todo-foot"><label for="todoIn" class="vh">משימה חדשה</label><input id="todoIn" placeholder="הוסף משימה" enterkeyhint="done" onkeydown="if(event.key==='Enter')addTodo()"><button class="btn btn-sm btn-ghost" onclick="addTodo()">הוסף</button>${all.length>4?`<button class="todo-more" onclick="S.todoOpen=!S.todoOpen;save();renderTodo()">${S.todoOpen?'פחות':`הכל (${all.length})`}</button>`:''}</div>`;
  $('todoBox').querySelectorAll('.thandle').forEach(bindTodoDrag);
}
function toggleTodo(id){const t=S.todos.find(x=>x.id===id);t.done=!t.done;save();renderTodo()}
function addTodo(){const v=$('todoIn').value.trim();if(!v){$('todoIn').focus();return}S.todos.unshift({id:'t'+Date.now(),text:v,done:false});save();renderTodo();$('todoIn').focus();toast('המשימה נוספה')}
function bindTodoDrag(h){
  h.addEventListener('pointerdown',e=>{
    const item=h.closest('.todo-item'),list=$('todoList');item.classList.add('dragging');h.setPointerCapture(e.pointerId);
    const mv=ev=>{const others=[...list.querySelectorAll('.todo-item:not(.dragging)')];const nxt=others.find(o=>{const r=o.getBoundingClientRect();return ev.clientY<r.top+r.height/2});nxt?list.insertBefore(item,nxt):list.appendChild(item)};
    const up=()=>{item.classList.remove('dragging');h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      const ids=[...list.querySelectorAll('.todo-item')].map(n=>n.dataset.id);S.todos=[...ids.map(id=>S.todos.find(t=>t.id===id)),...S.todos.filter(t=>!ids.includes(t.id))];save()};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}

/* ═════════ משרות חדשות ═════════ */
let lastAct=null, busy=false;
function renderJobs(){
  const q=queue(),done=DECK.length-q.length,saved=DECK.filter(id=>S.decisions[id]==='save').length;
  $('jobsCount').textContent=q.length?`משרה ${done+1} מתוך ${DECK.length}${saved?` · ${saved} נשמרו`:''}`:`עברת על כל ${DECK.length} המשרות${saved?` · ${saved} נשמרו`:''}`;
  $('jobsFiltered').textContent=`${FILTERED_OUT} סוננו כבכירות מדי`;
  $('deckProg').innerHTML=DECK.map((id,i)=>`<i class="${S.decisions[id]?'done':i===done?'cur':''}"></i>`).join('');
  const deck=$('deck');
  if(!q.length){
    $('deckActions').style.display='none';
    const sv=S.apps.filter(a=>a.status==='saved').length;
    deck.innerHTML=`<div class="empty"><div class="empty-ic">✓</div><h3>סיימת את המשרות של היום</h3><p>${escB(N('hunter'))} יחפש שוב הלילה.${sv?(sv===1?' בינתיים משרה אחת ששמרת מחכה להגשה.':` בינתיים ${sv} משרות ששמרת מחכות להגשה.`):''}</p>${sv?`<button class="btn btn-primary" onclick="goPage('apps')">להגשות</button>`:`<button class="btn btn-ghost" onclick="goPage('main')">ללוח הבקרה</button>`}</div>`;
    return;
  }
  $('deckActions').style.display='';
  deck.innerHTML=q.slice(0,3).reverse().map((id,ri,arr)=>{
    const pos=arr.length-1-ri;const j=JOBS[id];
    return`<article class="jcard${pos===1?' behind':pos===2?' behind2':''}" data-id="${id}" ${pos?'aria-hidden="true"':`aria-label="${escB(j.title)} ב-${escB(j.co)}, התאמה ${j.fit} מתוך 5"`}>${cardInner(j)}${pos===0?'<span class="stamp save" aria-hidden="true">שמור</span><span class="stamp skip" aria-hidden="true">דלג</span>':''}</article>`;
  }).join('');
  bindSwipe(deck.querySelector('.jcard:not(.behind):not(.behind2)'));
}
function fitLbl(f){return f>=4.3?'התאמה חזקה':f>=4?'התאמה טובה':'שווה בדיקה'}
function pills(f){const full=Math.floor(f),part=f-full;return`<div class="pills" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i>${i<full?'<b></b>':i===full&&part>0?`<b style="right:${((1-part)*100).toFixed(0)}%"></b>`:''}</i>`).join('')}</div>`}
function cardInner(j){
  return`<div class="jc-top">${logo(j)}<div style="flex:1;min-width:0"><div class="jc-title" lang="en" dir="ltr" style="text-align:right">${escB(j.title)}</div><div class="jc-co">${escB(j.co)} · ${escB(j.loc)}</div></div></div>
    <div class="fit"><div class="fit-num num">${j.fit.toFixed(1)}<small>/5</small></div><div class="fit-right"><div class="fit-lbl">${fitLbl(j.fit)}</div>${pills(j.fit)}</div></div>
    <div class="jc-reasons">${j.reasons.slice(0,2).map(r=>`<div class="jc-r"><span class="ic ok" aria-hidden="true">✓</span><span>${escB(r)}</span></div>`).join('')}${j.gaps.slice(0,1).map(g=>`<div class="jc-r"><span class="ic gap" aria-hidden="true">!</span><span>חסר: ${escB(g)}</span></div>`).join('')}</div>
    <div class="jc-desc" dir="auto">${escB(j.desc)}</div>
    <div class="jc-tags">${j.tags.map(t=>`<span class="chip" lang="en">${escB(t)}</span>`).join('')}</div>
    <div class="jc-foot"><span>${escB(j.src)} · ${agoTxt(j.posted)}</span>${j.salary?`<span>${escB(j.salary)}</span>`:''}</div>`;
}
function bindSwipe(card){
  if(!card)return;
  let sx=0,dx=0,on=false;
  const st=card.querySelector('.stamp.save'),sk=card.querySelector('.stamp.skip');
  card.addEventListener('pointerdown',e=>{if(busy)return;on=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none'});
  card.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`;st.style.opacity=Math.max(0,Math.min(1,dx/90));sk.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!on)return;on=false;
    if(Math.abs(dx)>90) decide(dx>0?'save':'skip');
    else if(Math.abs(dx)<6){card.style.transform='';openJobInfo()}
    else{card.style.transition='transform .4s cubic-bezier(.2,.9,.3,1.25)';card.style.transform='';st.style.opacity=0;sk.style.opacity=0}};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
function decide(kind){
  const q=queue();if(!q.length||busy)return;
  const id=q[0],j=JOBS[id],card=$('deck').querySelector(`.jcard[data-id="${id}"]`);
  busy=true;
  if(card){card.classList.add('fly');card.style.transform=`translateX(${kind==='save'?130:-130}%) rotate(${kind==='save'?14:-14}deg)`;card.style.opacity='0';}
  S.decisions[id]=kind;
  if(kind==='save'&&!S.apps.find(a=>a.jobId===id)) S.apps.unshift({id:'a-'+id,jobId:id,status:'saved',date:new Date().toISOString(),letter:REAL?'':letterFor(j)});
  save();lastAct={id,kind};
  setTimeout(()=>{busy=false;renderJobs();syncChrome()},340);
  if(kind==='save') toast(`${j.co} נשמרה בהגשות`,{undo:undoLast});
  else toast('למה זה לא מתאים?',{undo:undoLast,ms:5200,chips:['בכירה מדי','מיקום','טכנולוגיה','לא מעניין אותי'].map(t=>({t,fn:()=>{S.skipReasons[id]=t;save();toast('הבנתי. אציג פחות משרות כאלה')}}))});
}
function undoLast(){
  if(!lastAct)return;const{id,kind}=lastAct;delete S.decisions[id];delete S.skipReasons[id];
  if(kind==='save') S.apps=S.apps.filter(a=>!(a.jobId===id&&a.status==='saved'));
  save();lastAct=null;renderJobs();syncChrome();
}
function openJobInfo(id){
  id=id||queue()[0];if(!id)return;const j=JOBS[id];const inDeck=queue()[0]===id;
  openSheet(`<div style="display:flex;gap:13px;align-items:center">${logo(j)}<div style="min-width:0"><h3 id="sheetTitle" lang="en" dir="ltr" style="text-align:right">${escB(j.title)}</h3><div class="sheet-sub">${escB(j.co)} · ${escB(j.loc)}</div></div></div>
    <div class="fit" style="margin:16px 0 0"><div class="fit-num num">${j.fit.toFixed(1)}<small>/5</small></div><div class="fit-right"><div class="fit-lbl">${fitLbl(j.fit)}</div>${pills(j.fit)}</div></div>
    <div class="s-sec"><h4>למה זה מתאים לך</h4>${j.reasons.map(r=>`<div class="jc-r" style="margin-bottom:7px"><span class="ic ok" aria-hidden="true">✓</span><span>${escB(r)}</span></div>`).join('')}</div>
    ${j.partial?`<div class="s-sec"><p style="font-size:13px;color:var(--ink3)">לא היה תיאור מלא של המשרה, אז הדירוג לפי הכותרת בלבד ולא נכתב מה חסר.</p></div>`:''}
    ${j.gaps.length?`<div class="s-sec"><h4>מה חסר</h4>`:'<div hidden>'}${j.gaps.map(g=>`<div class="jc-r" style="margin-bottom:7px"><span class="ic gap" aria-hidden="true">!</span><span>${escB(g)}</span></div>`).join('')}</div>
    <div class="s-sec"><h4>על המשרה</h4><p dir="auto" style="font-size:14px;line-height:1.65;color:var(--ink2);text-align:start">${escB(j.desc)}</p></div>
    <div class="s-sec"><h4>פרטים</h4><div class="kv"><span>שכר</span><b>${escB(salaryTxt(j))}</b></div><div class="kv"><span>פורסם</span><b>${escB(j.src)}, ${agoTxt(j.posted)}</b></div></div>
    ${j.url?`<a class="btn btn-ghost" style="margin-top:14px;width:100%" href="${escB(j.url)}" target="_blank" rel="noopener">למודעה המלאה ב-${escB(j.src)} ↗</a>`:''}
    ${inDeck?`<div class="duo" style="margin-top:20px"><button class="btn btn-ghost" onclick="closeSheet();decide('skip')">דלג</button><button class="btn btn-primary" style="flex:2" onclick="closeSheet();decide('save')">שמור</button></div>`:''}`);
}

/* ═════════ הגשות ═════════ */
let trFilter='all';
function inSeg(a,k){return k==='all'||(k==='closed'?CLOSED.includes(a.status):a.status===k)}
function appSub(a){const d=daysSince(a.date);
  return a.status==='saved'?`שמרת ${agoTxt(d)}`:a.status==='interview'?`ראיון ${a.iv||'בתיאום'}`:a.status==='screening'?'מחכות לך שאלות סינון':a.status==='offer'?'קיבלת הצעה':CLOSED.includes(a.status)?STATUSES[a.status]:`הגשת ${agoTxt(d)}`}
function renderApps(){
  const cnt=k=>S.apps.filter(a=>inSeg(a,k)).length;
  if(trFilter!=='all'&&!cnt(trFilter)) trFilter='all';
  $('seg').innerHTML=SEGS.filter(([k])=>k==='all'||cnt(k)).map(([k,l])=>`<button class="chip${trFilter===k?' sel':''}" role="tab" aria-selected="${trFilter===k}" onclick="trFilter='${k}';renderApps()">${l} <b class="num">${cnt(k)}</b></button>`).join('');
  const list=S.apps.filter(a=>inSeg(a,trFilter));
  if(!list.length){$('appsList').innerHTML=`<div class="empty"><div class="empty-ic">📋</div><h3>עוד אין כאן משרות</h3><p>משרות שתשמור יגיעו לכאן, עם מכתב פנייה מוכן.</p><button class="btn btn-primary" onclick="goPage('jobs')">למשרות החדשות</button></div>`;return}
  const order={interview:0,screening:1,offer:2,saved:3,applied:4,rejected:5,ghosted:6,withdrew:7};
  $('appsList').innerHTML=list.slice().sort((x,y)=>order[x.status]-order[y.status]).map(a=>{
    const j=JOBS[a.jobId],fu=followDue(a);
    return`<article class="app glass">
      <button class="app-top" style="width:100%;text-align:right" onclick="openApp('${a.id}')" aria-label="${escB(j.title)} ב-${escB(j.co)}, ${STATUSES[a.status]}">
        ${logo(j)}<span class="app-info"><span class="app-title" lang="en" dir="ltr" style="display:block;text-align:right">${escB(j.title)}</span><span class="app-sub" style="display:block">${escB(j.co)} · ${escB(appSub(a))}</span></span>
        <span class="status st-${a.status}">${STATUSES[a.status]}</span></button>
      ${fu?`<div class="follow"><span>${daysSince(a.date)} ימים בלי תשובה. הודעה קצרה עכשיו מעלה את הסיכוי לתגובה.</span><button class="btn btn-sm btn-ghost" onclick="openApp('${a.id}','details')">להודעה</button></div>`:''}
      ${a.status==='saved'?`<div class="app-actions"><button class="btn btn-sm btn-ghost" onclick="openApp('${a.id}','letter')">למכתב</button><button class="btn btn-sm btn-primary" onclick="markApplied('${a.id}')">הגשתי</button></div>`:''}
      ${a.status==='interview'||a.status==='screening'?`<div class="app-actions"><button class="btn btn-sm btn-primary" onclick="openApp('${a.id}','prep')">${a.status==='interview'?'להכנה לראיון':'לשאלות הסינון'}</button></div>`:''}
    </article>`}).join('');
}
function markApplied(id){const a=appOf(id);a.status='applied';a.date=new Date().toISOString();save();refreshApps();toast('סימנתי שהגשת. אזכיר לך לשלוח הודעת המשך בעוד שבוע')}

/* application sheet: details · letter · referrals · prep */
let appTab='details';
function openApp(id,tab){
  const a=appOf(id);if(!a)return;
  const hasPrep=a.status==='interview'||a.status==='screening';
  appTab=tab==='prep'&&!hasPrep?'details':(tab||'details');
  const j=JOBS[a.jobId];
  const tabs=[['details','פרטים'],['letter','מכתב'],['ref','ממליצים'],...(hasPrep?[['prep',a.status==='interview'?'הכנה':'סינון']]:[])];

      <div class="duo"><button class="btn btn-ghost" onclick="copyText($('letterBox').value,'המכתב הועתק')">${ICO.copy}העתק</button><a class="btn btn-primary ext" href="${j.url||LI_URL+'jobs/'}" target="_blank" rel="noopener" onclick="copyText($('letterBox').value,'המכתב הועתק. הדבק אותו בטופס')">פתח את המשרה${ICO.open}</a></div>

function pickDraft(pid,i){S.li.drafts[pid]=i;delete S.li['edit_'+pid];save();const y=$('liScroll').scrollTop;renderLinkedIn();$('liScroll').scrollTop=y;$('ed-'+pid)?.focus({preventScroll:true})}
function handle(pid){S.li.handled[pid]=true;S.li.comments++;save();renderLinkedIn();syncChrome();toast(S.li.comments>=WEEK_GOAL.comments?'השגת את יעד התגובות של השבוע':`נספר. ${S.li.comments} מתוך ${WEEK_GOAL.comments} השבוע`)}

function toggleFix(id){S.li.fixes[id]?delete S.li.fixes[id]:S.li.fixes[id]=true;save();renderLinkedIn();syncChrome();if(S.li.fixes[id])toast(`הפרופיל עלה ל-${liScore()} מתוך 100`)}

/* ═════════ ONBOARDING ═════════ */
let onbStep=0, onbDraft=null, onbSingle=false;
function openOnb(step=0){onbSingle=step>0&&S.onboarded;onbStep=step;onbDraft=JSON.parse(JSON.stringify(prof()));closeSheet();closeDrawer();$('onb').classList.add('open');renderOnb()}
function closeOnb(){$('onb').classList.remove('open','qmode')}
function onbGo(d){onbStep=Math.max(0,Math.min(4,onbStep+d));if(onbStep===3&&CLOUDM)onbStep+=d>0?1:-1;if(onbStep===2)qi=Math.min(S.qi||0,Math.max(0,visibleQs().length-1));renderOnb()}
function renderOnb(){
  if(CLOUDM&&onbStep===3){if(onbSingle){closeOnb();return}onbStep=4}  // בענן המפתחות שמורים בשרת, אין מה לחבר
  if(onbStep===2){renderQ();return}
  $('onb').classList.remove('qmode');
  const p=onbDraft;p.cv=prof().cv;p.cvName=prof().cvName;
  $('onbSteps').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i===onbStep?'on':i<onbStep?'done':''}"></i>`).join('');
  $('onbBack').style.visibility=onbStep>0&&onbStep<4||onbSingle?'visible':'hidden';$('onbBack').textContent=onbSingle?'סגור':'חזרה';$('onbBack').onclick=onbSingle?closeOnb:()=>onbGo(-1);
  let body='',foot='';
  if(onbStep===0){
    body=`<div class="logo-mark" style="margin-bottom:22px"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.8l1.8 1.8L13.3 9"/></svg></div>
      <h1>משרד מלא שמחפש לך עבודה, ואתה רק מחליט.</h1><p class="lead">findjob סורק משרות ביום ובלילה, מדרג כל אחת מול קורות החיים והפרופיל האישי שלך ומכין מכתב פנייה.</p>`;
    foot=`<button class="btn btn-primary btn-block" onclick="onbGo(1)">בוא נתחיל</button>`;
  }else if(onbStep===1){
    body=`<h1>נעים להכיר</h1><p class="lead">מקורות החיים הסוכנים לומדים מה אתה יודע לעשות. הקובץ נשאר שלך ואפשר למחוק אותו בכל רגע.</p>
      <div class="field"><label for="onbFirst">איך לקרוא לך?</label><input id="onbFirst" value="${escB(prof().first)}" maxlength="20" autocomplete="given-name" oninput="prof().first=this.value.trim()||prof().first;save()"></div>
      <label for="cvFile" class="drop${p.cvName?' has':''}" role="button" tabindex="0"><span style="font-size:30px">${p.cvName?'✓':'📄'}</span><b>${p.cvName?escB(p.cvName):'בחר קובץ'}</b><span>${p.cvName?'לחץ להחלפה':'PDF, Word או טקסט'}</span></label>
      <div class="field" style="margin-top:18px"><label for="onbCv">או הדבק את הטקסט</label><textarea id="onbCv" rows="6" placeholder="סטודנט שנה ג׳ למדעי המחשב…" oninput="onbCvTyped(this)" onchange="onbCvTyped(this)" onkeyup="onbCvTyped(this)" onpaste="setTimeout(()=>onbCvTyped(this),0)">${escB(p.cv)}</textarea><div class="help" id="onbCvHelp"></div></div>`;
    foot=`<button class="btn btn-primary btn-block" id="onbNext" onclick="onbCvNext()">המשך</button><button class="link-btn" onclick="onbGo(1)">אוסיף אחר כך</button>`;
  }else if(onbStep===3){
    body=`<h1>צעד אחרון: לחבר את הסוכנים</h1><p class="lead">הסוכנים צריכים מפתח אישי כדי לעבוד בשבילך. זה חינם ולוקח שתי דקות.</p>
      <div class="key-steps"><div><span>להיכנס ל-<a href="https://console.groq.com/keys" target="_blank" rel="noopener" lang="en">console.groq.com/keys</a> עם חשבון Google</span></div><div><span>ללחוץ <span lang="en">Create API Key</span> ולהעתיק את המפתח</span></div><div><span>להדביק אותו כאן</span></div></div>
      <div class="field"><label for="onbKey">המפתח האישי</label><input id="onbKey" class="ltr" placeholder="gsk_..." value="${esc(p.key)}" autocomplete="off" spellcheck="false" oninput="onbDraft.key=this.value.trim();$('onbKeyBtn').disabled=!/^gsk_\\w{20,}/.test(onbDraft.key)">
        <div class="help">המפתח נשמר אצלך ומשמש רק את הסוכנים שלך.</div></div>`;
    foot=`<button class="btn btn-primary btn-block" id="onbKeyBtn" ${/^gsk_\w{20,}/.test(p.key)?'':'disabled'} onclick="onbNext()">${onbSingle?'שמור':'לחבר ולהמשיך'}</button><button class="link-btn" onclick="${onbSingle?'closeOnb()':'onbGo(1)'}">${onbSingle?'ביטול':'אחבר אחר כך'}</button>`;
  }else{
    body=`<div class="empty-ic" style="margin:20px 0 22px;background:var(--mint-lt)">✓</div><h1>הכל מוכן, ${escB(p.first)}</h1>
      <p class="lead">${CLOUDM?N('hunter')+' יחפש לך משרות בריצה הלילית הקרובה, לפי קורות החיים והתשובות שלך.':p.key?N('hunter')+' כבר מחפש לך משרות.':'כשתחבר את הסוכנים, '+N('hunter')+' יתחיל לחפש לך משרות.'} בינתיים הכנו ${DECK.length} משרות לדוגמה: מחליקים ימינה כדי לשמור ושמאלה כדי לדלג.</p>`;
    foot=`<button class="btn btn-primary btn-block" onclick="finishOnb('jobs')">למשרות</button><button class="link-btn" onclick="finishOnb('main')">ללוח הבקרה</button>`;
  }
  $('onbBody').innerHTML=body;$('onbFoot').innerHTML=foot;$('onbBody').scrollTop=0;
}
function onbCvTyped(t){prof().cv=t.value;save();const h=$('onbCvHelp');if(h)h.textContent=''}
function onbCvNext(){const t=$('onbCv');if(t)prof().cv=t.value;save();
  if(prof().cvName||prof().cv.trim().length>=15){onbGo(1);return}
  const h=$('onbCvHelp');if(h){h.textContent='בחר קובץ או הדבק לפחות כמה שורות מקורות החיים. אפשר גם להוסיף אחר כך.';h.style.color='var(--rose)'}}
function onbNext(){commitOnb();if(onbSingle){closeOnb();curPg==='settings'?renderSettings():renderProfile();toast(prof().key?'הסוכנים מחוברים':'נשמר')}else onbGo(1)}
function commitOnb(){const keep={cv:prof().cv,cvName:prof().cvName,ans:prof().ans||{}};S.profile=Object.assign({},onbDraft,keep);save();syncChrome()}
function finishOnb(pg){commitOnb();S.onboarded=true;save();closeOnb();goPage(pg);if(curPg===pg&&pg==='main')renderHome()}

/* ═════════ QUESTIONNAIRE — one question per screen ═════════ */
const isStudent=a=>a.status==='סטודנט/ית';
const QS=[
  {id:'status',t:'מה המצב שלך היום?',sub:'כך נדע אילו משרות להציג לך.',o:['סטודנט/ית','בוגר/ת טרי/ה, מחפש/ת עבודה ראשונה','ג׳וניור עם ניסיון של עד שנתיים','עובד/ת ומחפש/ת לעבור','משתחרר/ת משירות','לא עובד/ת כרגע']},
  {id:'year',when:isStudent,t:'באיזו שנה אתה בתואר?',o:['שנה א׳','שנה ב׳','שנה ג׳','שנה ד׳','תואר שני']},
  {id:'track',when:isStudent,t:'מה אתה מחפש עכשיו?',o:['משרת סטודנט חלקית','משרה מלאה אחרי התואר','את שתיהן']},
  {id:'field',t:'מה הרקע המקצועי שלך?',o:['מדעי המחשב','הנדסת תוכנה','הנדסת חשמל או מחשבים','מערכות מידע','מדעי הנתונים או סטטיסטיקה','בוטקאמפ או לימוד עצמי','אחר']},
  {id:'roles',multi:true,t:'אילו תפקידים מעניינים אותך?',sub:'אפשר לבחור כמה.',o:['Backend','Frontend','Full-Stack','Data / BI','AI / ML','QA ואוטומציה','DevOps / Cloud','סייבר','Embedded']},
  {id:'exp',t:'כמה ניסיון מעשי יש לך בפיתוח?',sub:'כולל עבודה, התמחות או פרויקטים בתשלום.',o:['אין עדיין','פחות משנה','1–2 שנים','3–5 שנים','יותר מ-5 שנים']},
  {id:'age',t:'מה הגיל שלך?',sub:'עוזר להתאים לך משרות. לא מופיע במכתבים ולא נשלח למעסיקים.',o:['18–21','22–25','26–29','30–34','35 ומעלה','מעדיף/ה לא לציין']},
  {id:'army',t:'מה עשית בשירות?',sub:'בישראל זה חלק חשוב מקורות החיים, במיוחד בתחילת הדרך.',o:['שירות טכנולוגי (8200, ממר״ם וכד׳)','קרבי','קצונה או תפקיד פיקודי','שירות אחר','שירות לאומי','לא שירתתי']},
  {id:'locs',multi:true,t:'איפה נוח לך לעבוד?',sub:'אפשר לבחור כמה.',o:['תל אביב','גוש דן והמרכז','השרון','ירושלים','חיפה והצפון','באר שבע והדרום']},
  {id:'mode',t:'איך אתה מעדיף לעבוד?',o:['מהמשרד','היברידי','מהבית','לא משנה לי']},
  {id:'start',t:'מתי אתה יכול להתחיל?',o:['מיד','תוך חודש','בעוד 2–3 חודשים','אחרי התואר']},
  {id:'salaryH',when:a=>isStudent(a)&&a.track==='משרת סטודנט חלקית',t:'כמה שכר לשעה אתה מצפה?',o:['עד ₪45','₪45–55','₪55–65','₪65 ומעלה','עוד לא יודע']},
  {id:'salary',when:a=>!(isStudent(a)&&a.track==='משרת סטודנט חלקית'),t:'מה ציפיות השכר שלך?',sub:'ברוטו לחודש, במשרה מלאה.',o:['עד ₪12K','₪12–16K','₪16–20K','₪20–25K','₪25K ומעלה','עוד לא יודע']},
  {id:'english',t:'מה רמת האנגלית שלך?',o:['שפת אם','שוטפת','טובה','בסיסית']},
  {id:'prio',multi:true,max:2,t:'מה הכי חשוב לך בעבודה הבאה?',sub:'עד 2 דברים.',o:['למידה וחניכה','שכר','טכנולוגיות מעניינות','סטארט-אפ קטן','חברה גדולה ויציבה','קרוב לבית','גמישות בשעות']},
];
let qi=0;
const ans=()=>(prof().ans=prof().ans||{});
const visibleQs=()=>QS.filter(q=>!q.when||q.when(ans()));
const qTotal=()=>visibleQs().length+(ans().status?0:2);
const answered=q=>{const v=ans()[q.id];return q.multi?Array.isArray(v)&&v.length>0:!!v};
function qProgress(){const v=visibleQs();return{done:v.filter(answered).length,total:v.length}}
function openQuestions(at){if(typeof at==='string')at=visibleQs().findIndex(q=>q.id===at);
  const v=visibleQs();qi=at!=null?at:Math.max(0,v.findIndex(q=>!answered(q)));if(qi<0)qi=0;
  onbSingle=S.onboarded;onbStep=2;onbDraft=JSON.parse(JSON.stringify(prof()));closeSheet();closeDrawer();$('onb').classList.add('open');renderOnb();
}
function renderQ(){
  const v=visibleQs();
  if(qi>=v.length){qDone();return}
  $('onb').classList.add('qmode');
  const q=v[qi],a=ans(),cur=a[q.id];
  const sel=o=>q.multi?(Array.isArray(cur)&&cur.includes(o)):cur===o;
  $('onbBody').innerHTML=`
    <div class="q-top"><button class="q-back" aria-label="חזרה" onclick="qBack()"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="q-prog" aria-hidden="true"><i style="width:${Math.round(qi/Math.max(v.length,qTotal())*100)}%"></i></div>
      <button class="q-later" onclick="qLater()">המשך אחר כך</button></div>
    <div class="q-count num">שאלה ${qi+1} מתוך ${Math.max(v.length,qTotal())}</div>
    <h1 class="q-title">${escB(q.t)}</h1>${q.sub?`<p class="q-sub">${escB(q.sub)}</p>`:''}
    <div class="q-card" role="${q.multi?'group':'radiogroup'}" aria-label="${escB(q.t)}">${q.o.map((o,i)=>`<button class="q-opt${sel(o)?' sel':''}" role="${q.multi?'checkbox':'radio'}" aria-checked="${sel(o)}" onclick="qPick(${i})"><span>${escB(o)}</span><span class="${q.multi?'cb':'rd'}"></span></button>`).join('')}</div>`;
  $('onbFoot').innerHTML=q.multi
    ?`<button class="btn btn-primary btn-block" ${answered(q)?'':'disabled'} onclick="qNext()">המשך</button><button class="link-btn" onclick="qNext()">דלג על השאלה</button>`
    :`<button class="link-btn" onclick="qNext()">${cur?'המשך':'דלג על השאלה'}</button>`;
  $('onbBody').scrollTop=0;
}
let qLock=false;
function qPick(i){
  if(qLock)return;
  const q=visibleQs()[qi],o=q.o[i],a=ans();
  if(q.multi){let arr=Array.isArray(a[q.id])?a[q.id]:[];
    if(arr.includes(o))arr=arr.filter(x=>x!==o);else{if(q.max&&arr.length>=q.max)arr=arr.slice(1);arr=[...arr,o]}
    a[q.id]=arr;save();renderQ();return}
  a[q.id]=o;save();
  document.querySelectorAll('.q-opt').forEach((b,j)=>{b.classList.toggle('sel',j===i);b.setAttribute('aria-checked',j===i)});
  qLock=true;setTimeout(()=>{qLock=false;qNext()},300);
}
function qNext(){qi++;S.qi=qi;save();renderQ()}
function qBack(){if(qi>0){qi--;renderQ()}else if(onbSingle)closeOnb();else{onbStep=1;renderOnb()}}
function qLater(){
  S.qi=qi;onbDraft.ans=prof().ans;commitOnb();
  const first=!S.onboarded;S.onboarded=true;save();closeOnb();
  if(first)goPage('main');else{curPg==='profile'?renderProfile():curPg==='main'?renderHome():0}
  const {done,total}=qProgress();toast(`שמרתי ${done} מתוך ${total} תשובות. אפשר להמשיך מהלוח או מהפרופיל`,{ms:4200});
}
function qDone(){
  S.qi=0;onbDraft.ans=prof().ans;commitOnb();
  if(onbSingle){closeOnb();curPg==='profile'?renderProfile():renderHome();toast(`הפרופיל עודכן. מהחיפוש הבא ${N('hunter')} יתחשב בתשובות`)}
  else{onbStep=3;renderOnb()}
}

function planWhy(){
  const a=ans(),w=[];
  w.push(a.status==='סטודנט/ית'?(a.track==='משרה מלאה אחרי התואר'?'משרות ג׳וניור למשרה מלאה אחרי התואר':'משרות סטודנט, התמחויות וג׳וניור')
    :a.status?{'בוגר/ת טרי/ה, מחפש/ת עבודה ראשונה':'משרה ראשונה: ג׳וניור','משתחרר/ת משירות':'משרה ראשונה: ג׳וניור','ג׳וניור עם ניסיון של עד שנתיים':'משרות ג׳וניור'}[a.status]||'משרות לפי הניסיון שלך'
    :'משרות ג׳וניור, עד שתספר לנו מה המצב שלך');
  w.push(a.roles&&a.roles.length?'בתפקידים: '+a.roles.join(', '):'בכל תפקידי הפיתוח, עד שתבחר תפקידים');

function targetCompanies(){

  const cities=new Set((a.locs||[]).flatMap(r=>REGION_CITIES[r]||[])),junior=a.status!=='עובד/ת ומחפש/ת לעבור';

  const added=new Set(tc.added.map(x=>x.toLowerCase()));

    if(c.sectors.some(x=>sectors.has(x))){s+=3;why.push('בתחום שבחרת')}

      ${learned.length?`<div class="card-sub">מהמשרות שדילגת עליהן. אם משהו לא נכון, אפשר להסיר.</div><div class="learned">${learned.map(([r,n])=>`<span class="chip">${escB(L[r]||r)} <span class="num" style="color:var(--ink3)">(${n})</span><button aria-label="להסיר: ${escB(L[r]||r)}" onclick="forget('${r}')">×</button></span>`).join('')}</div>`
        :`<div class="card-sub" style="margin:0">כשתדלג על משרה ותגיד למה, נלמד ונסנן בהתאם. ${FILTERED_OUT} משרות בכירות מדי כבר סוננו לפי התשובות שלך.</div>`}</section>`;
  drawTeam();
}
function renameAgent(key,v){v=v.trim();const i=CAREER.agents.findIndex(a=>a.key===key);
  if(!v||v===TEAM_DEFAULT[i].name){delete S.team[key]}else S.team[key]=v;save();applyTeam();syncChrome();renderProfile();toast(`נשמר: ${N(key)}, ${AG(key).role}`)}
function editMe(){const p=prof();openSheet(`<h3 id="sheetTitle">השם שלך</h3><div class="sheet-sub">כך נפנה אליך באפליקציה ובמכתבים</div>
  <div class="field" style="margin-top:14px"><label for="meFirst">איך לקרוא לך</label><input id="meFirst" value="${escB(p.first)}" maxlength="20"></div>
  <div class="field"><label for="meFull">שם מלא, כמו במכתבים</label><input id="meFull" value="${escB(p.name)}" maxlength="40"></div>
  <button class="btn btn-primary btn-block" onclick="saveMe()">שמירה</button>`)}
function saveMe(){const f=$('meFirst').value.trim(),n=$('meFull').value.trim();if(!f){$('meFirst').focus();toast('צריך שם');return}prof().first=f;if(n)prof().name=n;save();closeSheet();syncChrome();renderProfile();toast('נשמר')}
function drawTeam(){CAREER.agents.forEach((g,i)=>face($('tm-'+i),i))}
function forget(r){Object.keys(S.skipReasons).forEach(k=>{if(S.skipReasons[k]===r)delete S.skipReasons[k]});save();renderProfile();toast('הוסר')}
function editStory(id){
  const st=id?S.stories.find(x=>x.id===id):{id:'',t:'',b:'מצב: \nמשימה: \nפעולה: \nתוצאה: '};
  openSheet(`<h3 id="sheetTitle">${id?'עריכת סיפור':'סיפור חדש'}</h3><div class="sheet-sub">מצב, משימה, פעולה ותוצאה. עדיף עם מספר אחד לפחות.</div>
    <div class="field" style="margin-top:14px"><label for="stT">כותרת</label><input id="stT" value="${escB(st.t)}" placeholder="למשל: Lifeboard, מגבלת API"></div>
    <div class="field"><label for="stB">הסיפור</label><textarea id="stB" rows="8">${esc(st.b)}</textarea></div>
    <div class="duo">${id?`<button class="btn btn-ghost" onclick="S.stories=S.stories.filter(x=>x.id!=='${id}');save();closeSheet();renderProfile();toast('הסיפור נמחק')">מחיקה</button>`:''}<button class="btn btn-primary" style="flex:2" onclick="saveStory('${id}')">שמירה</button></div>`);
}
function saveStory(id){const t=$('stT').value.trim(),b=$('stB').value;if(!t){$('stT').focus();toast('צריך כותרת לסיפור');return}
  if(id){Object.assign(S.stories.find(x=>x.id===id),{t,b})}else S.stories.push({id:'s'+Date.now(),t,b});save();closeSheet();renderProfile();toast('הסיפור נשמר')}
function editCvText(){openSheet(`<h3 id="sheetTitle">קורות חיים כטקסט</h3><div class="sheet-sub">הסוכנים עובדים לפי הטקסט הזה</div><div class="field" style="margin-top:14px"><label for="cvEdit" class="vh">קורות חיים</label><textarea id="cvEdit" rows="12">${esc(prof().cv)}</textarea></div><button class="btn btn-primary btn-block" onclick="prof().cv=$('cvEdit').value;save();closeSheet();renderProfile();toast('קורות החיים נשמרו')">שמירה</button>`)}
function onCvFile(inp){
  const f=inp.files[0];if(!f)return;prof().cvName=f.name;
  readCv(f).then(t=>{if(t&&t.trim().length>30)prof().cv=t.slice(0,20000);else toast('לא הצלחתי לקרוא טקסט מהקובץ. אפשר להדביק אותו כטקסט',{ms:4200});save();afterCv()});
  inp.value='';
}
/* קריאת קורות חיים בדפדפן: PDF (pdf.js), Word (mammoth), טקסט. הקובץ לא נשלח לשום מקום */
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function readCv(f){try{
  if(/\.(txt|md)$/i.test(f.name))return await f.text();
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(base+'pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){const c=await (await doc.getPage(i)).getTextContent();let y=null;
      for(const it of c.items){const ny=it.transform[5];if(y!==null&&Math.abs(ny-y)>3)out+='\n';else if(out&&!out.endsWith(' ')&&!out.endsWith('\n'))out+=' ';out+=it.str;y=ny}out+='\n'}
    return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n')}
  if(/\.docx$/i.test(f.name)){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
}catch(e){console.warn(e)}return''}
function afterCv(){if($('onb').classList.contains('open'))renderOnb();else{renderProfile();toast('קורות החיים עודכנו')}}

/* ═════════ הגדרות ═════════ */
function renderSettings(){
  const p=prof();
  $('setScroll').innerHTML=`
    ${CLOUDM&&ME?`<section class="card glass" aria-labelledby="accH"><h2 class="card-h" id="accH">החשבון</h2><div class="card-sub" dir="ltr" style="text-align:right">${escB(ME.email||'')}</div><button class="btn btn-sm btn-ghost btn-block" style="margin-top:12px" onclick="cloudLogout()">יציאה</button></section>`:''}
    <section class="card glass" aria-labelledby="aiH"><h2 class="card-h" id="aiH">הסוכנים</h2>
      ${CLOUDM?`<div class="ok-line">הסוכנים מחוברים ורצים בענן</div><div class="card-sub" style="margin:6px 0 0">${N('hunter')} מחפש כל לילה, ו${N('assistant')} מכין מכתבים כל שעתיים.</div>`:p.key?`<div class="ok-line">הסוכנים מחוברים ועובדים</div>`:`<div class="warn-line">הסוכנים עוד לא מחוברים</div><div class="card-sub" style="margin:6px 0 0">עד שתחבר, מוצגות דוגמאות.</div>`}
      <button class="btn btn-sm ${p.key?'btn-ghost':'btn-primary'} btn-block" style="margin-top:12px" onclick="openOnb(3)" ${CLOUDM?'hidden':''}>${p.key?'להחליף מפתח':'לחבר עכשיו'}</button></section>

    <section class="card glass" aria-labelledby="ntH"><h2 class="card-h" id="ntH">התראות</h2>
      <div class="row"><span class="ri">${ROW_IC.bell}</span><span class="rl"><b id="nb">בריף בוקר</b><span>כל יום ב-08:00, הודעה אחת עם מה שחשוב</span></span><button class="switch${S.notif?' on':''}" role="switch" aria-checked="${S.notif}" aria-labelledby="nb" onclick="S.notif=!S.notif;save();renderSettings()"></button></div></section>

    <section class="card glass" aria-labelledby="gnH"><h2 class="card-h" id="gnH">כללי</h2>
      <div class="row"><span class="ri">${ROW_IC.globe}</span><span class="rl"><b>שפה</b><span>עברית</span></span></div>
      <button class="row" onclick="openOnb(0)"><span class="ri">${ROW_IC.replay}</span><span class="rl"><b>להתחיל את ההיכרות מחדש</b><span>קורות חיים, שאלון וחיבור</span></span><span class="chev" aria-hidden="true"></span></button>
      <button class="row" onclick="confirmWipe()"><span class="ri">${ROW_IC.trash}</span><span class="rl"><b class="danger">למחוק את כל הנתונים שלי</b><span>קורות חיים, משרות, מכתבים ומפתח</span></span></button></section>
    <p style="text-align:center;font-size:12px;color:var(--ink3)">findjob · גרסה 0.2</p>`;
}
function confirmWipe(){openSheet(`<h3 id="sheetTitle">למחוק את כל הנתונים?</h3><div class="sheet-sub">קורות החיים, המשרות, המכתבים והמפתח יימחקו מהמכשיר. אי אפשר לשחזר.</div><div class="duo" style="margin-top:20px"><button class="btn btn-ghost" onclick="closeSheet()">ביטול</button><button class="btn" style="background:var(--rose);color:#fff" onclick="LS.clear();location.reload()">למחוק הכל</button></div>`)}

/* ═════════ chat with the assistant ═════════ */
let chatOpen=false;
const SUGS=['מה כדאי לעשות היום?','איזו משרה הכי מתאימה לי?','בוא נתרגל ראיון'];
function toggleChat(force){
  chatOpen=force===true?true:!chatOpen;$('chatPop').classList.toggle('open',chatOpen);
  $('chatName').textContent=N('assistant');
  if(chatOpen){if(!$('chatMsgs').children.length)addMsg('bot',`היי ${prof().first}, אני ${N('assistant')}. אני עוקב אחרי מה שכל הצוות עושה. במה לעזור?`);
    $('chatSugs').innerHTML=SUGS.map(s=>`<button onclick="chatAsk('${s}')">${s}</button>`).join('');face($('chatFace'),5);setTimeout(()=>$('chatInput').focus(),260)}
}
function addMsg(who,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('chatMsgs').appendChild(d);$('chatMsgs').scrollTop=1e6}
function chatAsk(t){$('chatInput').value=t;sendChat()}
function sendChat(){
  const v=$('chatInput').value.trim();if(!v)return;addMsg('me',v);$('chatInput').value='';
  const q=queue();let r;
  if(/היום|לעשות|כדאי/.test(v)){const n=nextSteps();r=n.length?'הכי חשוב עכשיו:\n'+n.slice(0,3).map((x,i)=>`${i+1}. ${x.b}`).join('\n'):'אין משהו דחוף. זה זמן טוב לעבור על בנק הסיפורים בפרופיל.'}
  else if(/מתאימ|משרה/.test(v)) r=q.length?`הכי חזקה כרגע: ${JOBS[q[0]].title} ב-${JOBS[q[0]].co}, התאמה ${JOBS[q[0]].fit} מתוך 5. ${JOBS[q[0]].reasons[0]}.`:'עברת על כל המשרות של היום. בהגשות יש משרות ששמרת ומחכות להגשה.';
  else if(/ראיון|תרגל|סינון/.test(v)) r='נתחיל. איך היית מתכנן מערכת התראות לבורד עם מיליון משתמשים? כתוב את הרכיבים הראשונים, ואני אגיב.';
  else r='רשמתי. ברגע שהסוכנים יהיו מחוברים, אענה מהנתונים האמיתיים שלך.';
  setTimeout(()=>addMsg('bot',r),550);
}

/* ═════════ init ═════════ */
function init(){
  syncChrome();
  goPage('main');
  setTimeout(()=>{$('splash').classList.add('hide');if(!S.onboarded)openOnb(0)},1100);
}

/* ═════════ CLOUD — חיבור ל-Supabase (רק בגרסה המאוחסנת) ═════════
   התחברות בקישור למייל. הפרופיל, קורות החיים והשאלון נשמרים בענן, והסוכנים קוראים אותם משם בלילה.
   המשרות שדורון מצא נטענות מהענן. כל משתמש רואה רק את הנתונים שלו (RLS). */
let SB=null,ME=null,_profSnap='',_decSnap={},_syncT=null;
function cloudLogin(msg){
  const o=$('onb');o.classList.add('open');o.classList.remove('qmode');
  $('onbSteps').innerHTML='';$('onbBack').style.visibility='hidden';
  $('onbBody').innerHTML=`<div class="logo-mark" style="margin-bottom:22px"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.8l1.8 1.8L13.3 9"/></svg></div>
    <h1>כניסה ל-findjob</h1><p class="lead">נשלח לך קישור כניסה למייל. בלי סיסמה.</p>
    <div class="field"><label for="loginEmail">המייל שלך</label><input id="loginEmail" class="ltr" type="email" autocomplete="email" inputmode="email" placeholder="name@gmail.com" onkeydown="if(event.key==='Enter')cloudSend()">
    <div class="help" id="loginHelp">${msg||''}</div></div>`;
  $('onbFoot').innerHTML=`<button class="btn btn-primary btn-block" id="loginBtn" onclick="cloudSend()">שלחו לי קישור</button>`;
  setTimeout(()=>$('splash').classList.add('hide'),400);
}
async function cloudSend(){
  const em=($('loginEmail').value||'').trim(),h=$('loginHelp');
  if(!/^\S+@\S+\.\S+$/.test(em)){h.textContent='צריך כתובת מייל תקינה';h.style.color='var(--rose)';return}
  $('loginBtn').disabled=true;
  const {error}=await SB.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
  $('loginBtn').disabled=false;
  if(error){h.textContent='לא הצלחתי לשלוח: '+error.message;h.style.color='var(--rose)';return}
  h.style.color='var(--brand)';h.textContent='נשלח. פתח את המייל באותו מכשיר ולחץ על הקישור.';
}
async function cloudLoad(){
  const uid=ME.id;
  const [{data:pr},{data:jobs},{data:runs}]=await Promise.all([
    SB.from('profiles').select('*').eq('user_id',uid).maybeSingle(),
    SB.from('jobs').select('id,card,decision,letter,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(200),
    SB.from('runs').select('stats,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(1)]);
  if(pr){const p=prof();p.first=pr.first||p.first;p.name=pr.name||p.name;p.cv=pr.cv_text||p.cv;p.ans=Object.assign({},pr.answers||{},p.ans||{});
    if(pr.team&&Object.keys(pr.team).length)S.team=pr.team;const st=pr.state||{};['apps','todos','stories'].forEach(k=>{if(Array.isArray(st[k]))S[k]=st[k]});if(pr.cv_text)S.onboarded=true}
  prof().key='cloud';
  if(runs&&runs.length){
    const live=(jobs||[]).filter(r=>r.decision!=='skip'||S.decisions[r.id]);
    setFeed({generated_at:runs[0].created_at,stats:runs[0].stats||{},jobs:live.map(r=>Object.assign({},r.card,{letter:r.letter||null})).sort((a,b)=>b.fit-a.fit)});
    (jobs||[]).forEach(r=>{if(r.decision)S.decisions[r.id]=r.decision});
  }
  S.apps=(S.apps||[]).filter(a=>JOBS[a.jobId]);
  _decSnap=Object.assign({},S.decisions);_profSnap=profRow();
  LS.set(SKEY,S);if(typeof applyTeam==='function')applyTeam();
}
function profRow(){const p=prof();return JSON.stringify({first:p.first||'',name:p.name||'',cv_text:p.cv||'',answers:p.ans||{},team:S.team||{},state:{apps:S.apps,todos:S.todos,stories:S.stories}})}
function cloudSync(){clearTimeout(_syncT);_syncT=setTimeout(async()=>{
  if(!ME)return;
  const row=profRow();
  if(row!==_profSnap){const r=JSON.parse(row);r.user_id=ME.id;r.updated_at=new Date().toISOString();
    const {error}=await SB.from('profiles').upsert(r);if(!error)_profSnap=row;else toast('לא הצלחתי לשמור בענן. אנסה שוב');}
  const ids=new Set([...Object.keys(_decSnap),...Object.keys(S.decisions)]);
  for(const id of ids){const v=S.decisions[id]||null;if((_decSnap[id]||null)===v||!JOBS[id])continue;
    const {error}=await SB.from('jobs').update({decision:v}).eq('user_id',ME.id).eq('id',id);if(!error){if(v)_decSnap[id]=v;else delete _decSnap[id]}}
},700)}
async function cloudBoot(){
  SB=supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
  const {data:{session}}=await SB.auth.getSession();
  if(!session){cloudLogin();SB.auth.onAuthStateChange((ev,s)=>{if(s&&!ME)location.reload()});return}
  ME=session.user;
  try{await cloudLoad()}catch(e){console.warn(e);toast('אין חיבור לענן כרגע. מוצג מה ששמור במכשיר')}
  closeOnb();init();
}
function cloudLogout(){SB.auth.signOut().then(()=>{LS.clear();location.reload()})}

cloudBoot();
</script>
