<div id="app">
  <main id="pages">

    <section class="pg on" id="pg-main" aria-labelledby="tbTitle">
      <div class="scroll" id="homeScroll"></div>
    </section>

    <section class="pg" id="pg-jobs" aria-labelledby="tbTitle">
      <div class="jobs-wrap">
        <div class="jobs-meta"><span id="jobsCount" class="num"></span><button class="filtered" id="jobsFiltered" onclick="goPage('profile','learned')"></button></div>
        <div class="deck-progress" id="deckProg" aria-hidden="true"></div>
        <div class="deck" id="deck"></div>
        <div class="deck-actions" id="deckActions">
          <button class="act skip" aria-label="דלג על המשרה" onclick="decide('skip')"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <button class="act save" aria-label="שמור את המשרה" onclick="decide('save')"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></button>
          <button class="act info" aria-label="פרטי המשרה" onclick="openJobInfo()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
        </div>
      </div>
    </section>

    <section class="pg" id="pg-apps" aria-labelledby="tbTitle">
      <div class="scroll">
        <div class="seg" id="seg" role="tablist" aria-label="שלבי הגשה"></div>
        <div id="appsList" class="stack"></div>
      </div>
    </section>

    <section class="pg" id="pg-linkedin" aria-labelledby="tbTitle">
      <div class="scroll" id="liScroll"></div>
    </section>

    <!--OFFICE_HTML-->

    <section class="pg" id="pg-profile" aria-labelledby="tbTitle">
      <div class="scroll" id="profScroll"></div>
    </section>

    <section class="pg" id="pg-settings" aria-labelledby="tbTitle">
      <div class="scroll" id="setScroll"></div>
    </section>

  </main>
</div>

<div id="chatPop" role="dialog" aria-label="צ׳אט עם העוזר האישי">

    <button class="dr-x" aria-label="סגירת השיחה" onclick="toggleChat()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="chat-msgs" id="chatMsgs" aria-live="polite"></div>

  <div class="chat-in"><label for="chatInput" class="vh">הודעה לעוזר</label><input id="chatInput" placeholder="כתוב הודעה" onkeydown="if(event.key==='Enter')sendChat()"><button aria-label="שליחה" onclick="sendChat()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button></div>
</div>
